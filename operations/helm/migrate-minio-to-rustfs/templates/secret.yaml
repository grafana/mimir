{{- if .Values.secret.create }}
# Dev-only Secret. Production: secret.create=false with your own Secret
# (kubectl, ExternalSecrets, Vault, SealedSecrets) holding the six keys.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "migrate.secretName" . }}
  labels:
    {{- include "migrate.labels" . | nindent 4 }}
type: Opaque
stringData:
  MINIO_ENDPOINT: {{ required "secret.minioEndpoint is required when secret.create=true" .Values.secret.minioEndpoint | quote }}
  MINIO_ACCESS_KEY_ID: {{ required "secret.minioAccessKeyId is required when secret.create=true" .Values.secret.minioAccessKeyId | quote }}
  MINIO_SECRET_ACCESS_KEY: {{ required "secret.minioSecretAccessKey is required when secret.create=true" .Values.secret.minioSecretAccessKey | quote }}
  RUSTFS_ENDPOINT: {{ required "secret.rustfsEndpoint is required when secret.create=true" .Values.secret.rustfsEndpoint | quote }}
  RUSTFS_ACCESS_KEY_ID: {{ required "secret.rustfsAccessKeyId is required when secret.create=true" .Values.secret.rustfsAccessKeyId | quote }}
  RUSTFS_SECRET_ACCESS_KEY: {{ required "secret.rustfsSecretAccessKey is required when secret.create=true" .Values.secret.rustfsSecretAccessKey | quote }}
{{- end }}
