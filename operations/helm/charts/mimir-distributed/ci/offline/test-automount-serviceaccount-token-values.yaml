# Pin kube version so results are the same for running in CI and locally where the installed kube version may be different.
kubeVersionOverride: "1.32"

global:
  # Opt every pod managed by this chart out of service account token auto-mounting.
  automountServiceAccountToken: false

# Vault Agent injection needs the token on the components it annotates, which includes the
# gateway but not the dedicated ruler query path.
vaultAgent:
  enabled: true
  roleName: "test-role-name"
  clientCertPath: "client-cert-path"
  clientKeyPath: "client-key-path"
  serverCertPath: "server-cert-path"
  serverKeyPath: "server-key-path"
  caCertPath: "ca-cert-path"

mimir:
  structuredConfig:
    # Mimir's own Vault client reads the token itself. This needs the token on every component that
    # runs the Mimir binary, which includes the dedicated ruler query path but not the gateway.
    vault:
      enabled: true
      url: http://vault.citestns.svc:8200
      mount_path: secret
      auth:
        type: kubernetes
        kubernetes:
          role_name: test-role-name

# Deploy the components that distinguish the two integrations from each other.
ruler:
  remoteEvaluationDedicatedQueryPath: true

# The smoke-test Job renders by default and runs -target=continuous-test, which never initializes Mimir's
# Vault client, so it covers a component that stays opted out. continuous-test is deliberately left
# disabled: its Deployment carries no PodDisruptionBudget and a non-zero rollingUpdate.maxUnavailable, both
# of which the conftest policies reject.

chunks-cache:
  enabled: true
index-cache:
  enabled: true
metadata-cache:
  enabled: true
results-cache:
  enabled: true

# Needs the token through both integrations, but an explicit per-component value still wins.
ingester:
  automountServiceAccountToken: false

# Needs the token through neither integration; an explicit true overrides the chart-wide false.
kafka:
  automountServiceAccountToken: true
