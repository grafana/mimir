{{- if .Values.minio.enabled }}
{{- if .Values.minio.buckets }}
# Minio provides post-install hook to create bucket
# however the hook won't be executed if helm install is run
# with --wait flag. Hence this job is a workaround for that.
# See https://github.com/grafana/mimir/issues/2464
{{- $minioSub := index .Subcharts "minio" }}
{{- $baseName := printf "%s-%s" (include "mimir.resourceName" (dict "ctx" . "component" "make-minio-buckets")) $minioSub.Chart.Version }}
{{- $prefix := regexReplaceAll "[^a-z0-9-]" (lower $baseName) "-" | trimAll "-" | trunc 52 | trimAll "-" }}
{{- $podTemplate := include "mimir.minio.bucketJobPodTemplate" . }}
{{- $identity := $podTemplate | fromYaml | toJson | sha256sum | trunc 10 }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-%s" $prefix $identity }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app: {{ template "minio.name" . }}-make-bucket-job
    chart: {{ template "minio.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
{{- with .Values.minio.makeBucketJob.annotations }}
  annotations:
{{ toYaml . | indent 4 }}
{{- end }}
spec:
  template:
{{ include "mimir.minio.bucketJobPodTemplate" . | indent 4 }}
{{- end }}
{{- end }}
