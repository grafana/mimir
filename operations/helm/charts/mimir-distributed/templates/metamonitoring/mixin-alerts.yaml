{{- with .Values.metaMonitoring.prometheusRule }}
{{- if .mimirAlerts }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "mimir.resourceName" (dict "ctx" $ "component" "alerts") }}
  {{- with .annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "mimir.labels" (dict "ctx" $) | nindent 4 }}
    {{- with .labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  namespace: {{ .namespace | default $.Release.Namespace | quote }}
spec:
    {{- /* The shared mixin keeps its custom-deployment selector; only Helm bundled rules target this release Service. */ -}}
    {{- $endpointSelector := printf "kube_endpoint_address{endpoint=%q, namespace=%q}" (include "mimir.resourceName" (dict "ctx" $ "component" "gossip-ring")) $.Release.Namespace -}}
    {{- $.Files.Get "mixins/alerts.yaml" | replace "kube_endpoint_address{endpoint=\"gossip-ring\"}" $endpointSelector | nindent 2 }}
{{- end }}
{{- end }}