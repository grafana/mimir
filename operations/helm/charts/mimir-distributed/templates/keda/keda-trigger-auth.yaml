{{- if and .Values.kedaAutoscaling.authentication.enabled (eq .Values.kedaAutoscaling.authentication.kind "TriggerAuthentication") }}
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: {{ .Values.kedaAutoscaling.authentication.name }}
  namespace: {{ .Release.Namespace | quote }}
spec:
  secretTargetRef:
  {{- with .Values.kedaAutoscaling.authentication.secretTargetRef }}
    {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}