---
# Source: mimir-distributed/templates/minio/create-bucket-job.yaml
# Minio provides post-install hook to create bucket
# however the hook won't be executed if helm install is run
# with --wait flag. Hence this job is a workaround for that.
# See https://github.com/grafana/mimir/issues/2464
apiVersion: batch/v1
kind: Job
metadata:
  name: test-oss-values-mimir-make-minio-buckets-5.4.0
  namespace: "citestns"
  labels:
    app: mimir-distributed-make-bucket-job
    release: test-oss-values
    heritage: Helm
spec:
  template:
    metadata:
      labels:
        app: mimir-distributed-job
        release: test-oss-values
    spec:
      restartPolicy: OnFailure      
      volumes:
        - name: minio-configuration
          projected:
            sources:
            - configMap:
                name: test-oss-values-minio
            - secret:
                name: test-oss-values-minio
      containers:
      - name: minio-mc
        image: "pgsty/silo:RELEASE.2026-09-03T13-18-01Z@sha256:b616a0cf8cb281e7e6bb3c9b1fb53875b4016a2878223925541c18f82d6c5ca3"
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "/config/initialize"]
        env:
          - name: MINIO_ENDPOINT
            value: test-oss-values-minio
          - name: MINIO_PORT
            value: "9000"
        volumeMounts:
          - name: minio-configuration
            mountPath: /config
        resources:
          requests:
            memory: 128Mi

