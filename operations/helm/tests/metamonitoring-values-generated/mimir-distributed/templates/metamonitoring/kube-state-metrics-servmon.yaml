---
# Source: mimir-distributed/templates/metamonitoring/kube-state-metrics-servmon.yaml
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: metamonitoring-values-mimir-k8s-ksm
  namespace: "citestns"
  labels:
    app.kubernetes.io/name: mimir
    app.kubernetes.io/instance: metamonitoring-values
    app.kubernetes.io/component: meta-monitoring
    app.kubernetes.io/managed-by: Helm
spec:
  endpoints:
    - port: http-metrics
      metricRelabelings:
        - action: keep
          # Retain workload metrics and this release gossip-ring endpoint addresses.
          regex: "(?:[^;]*;){0,2}metamonitoring-values-mimir[^;]*;.*|;;;kube_endpoint_address;citestns;metamonitoring-values-mimir-gossip-ring"
          sourceLabels:
            - deployment
            - statefulset
            - pod
            - __name__
            - namespace
            - endpoint
          separator: ';'
      relabelings:
        - targetLabel: cluster
          replacement: "metamonitoring-values"
      path: /metrics
      honorLabels: true # retain namespace label from kube-state-metrics
  namespaceSelector:
    matchNames:
      - kube-system
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics
