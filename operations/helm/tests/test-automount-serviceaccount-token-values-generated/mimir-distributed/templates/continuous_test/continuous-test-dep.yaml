---
# Source: mimir-distributed/templates/continuous_test/continuous-test-dep.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    {}
  labels:
    app.kubernetes.io/name: mimir
    app.kubernetes.io/instance: test-automount-serviceaccount-token-values
    app.kubernetes.io/component: continuous-test
    app.kubernetes.io/managed-by: Helm
  name: test-automount-serviceaccount-token-values-mimir-continuous-test
  namespace: "citestns"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mimir
      app.kubernetes.io/instance: test-automount-serviceaccount-token-values
      app.kubernetes.io/component: continuous-test
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mimir
        app.kubernetes.io/instance: test-automount-serviceaccount-token-values
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/component: continuous-test
      annotations:
      namespace: "citestns"
    spec:
      serviceAccountName: test-automount-serviceaccount-token-values-mimir
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: continuous-test
          imagePullPolicy: IfNotPresent
          args:
            - "-target=continuous-test"
            - "-config.expand-env=true"
            - "-config.file=/etc/mimir/mimir.yaml"
            - "-activity-tracker.filepath="
            - "-server.http-listen-port=8080"
            - "-tests.write-read-series-test.num-series=1000"
            - "-tests.write-read-series-test.max-query-age=48h"
            - "-tests.write-endpoint=http://test-automount-serviceaccount-token-values-mimir-gateway.citestns.svc:80"
            - "-tests.read-endpoint=http://test-automount-serviceaccount-token-values-mimir-gateway.citestns.svc:80/prometheus"
            - "-tests.run-interval=5m"
            - "-tests.tenant-id=mimir-continuous-test"
          volumeMounts:
            - name: config
              mountPath: /etc/mimir
          ports:
            - name: http-metrics
              containerPort: 8080
              protocol: TCP
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          env:
            []
      
      terminationGracePeriodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: test-automount-serviceaccount-token-values-mimir-config
            items:
              - key: "mimir.yaml"
                path: "mimir.yaml"
