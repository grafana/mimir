# Run with `make check-mixin-promtool-tests` (after `make build-mixin`).
rule_files:
  - ../mimir-mixin-compiled/alerts.yaml
evaluation_interval: 1m
tests:
  - name: server errors fire after the five-minute pending period
    interval: 15s
    input_series:
      - series: cortex_ruler_write_requests_total{cluster="c1",namespace="mimir",pod="ruler-0",user="tenant-1"}
        values: 0+15x80
      - series: cortex_ruler_write_requests_failed_total{cluster="c1",namespace="mimir",pod="ruler-0",user="tenant-1",reason="server_error"}
        values: 0+3x80
      - series: cortex_ruler_write_requests_failed_total{cluster="c1",namespace="mimir",pod="ruler-0",user="tenant-1",reason="client_error"}
        values: 0+0.75x80
    alert_rule_test:
      - eval_time: 5m
        alertname: MimirRulerTooManyFailedPushes
        exp_alerts: []
      - eval_time: 9m
        alertname: MimirRulerTooManyFailedPushes
        exp_alerts:
          - exp_labels:
              severity: critical
              cluster: c1
              namespace: mimir
              pod: ruler-0
            exp_annotations:
              message: "Mimir Ruler ruler-0 in c1/mimir is experiencing 20.00% write (push) errors.\n"
              runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimirrulertoomanyfailedpushes
  - name: legacy failures without reason still fire
    interval: 15s
    input_series:
      - series: cortex_ruler_write_requests_total{cluster="c1",namespace="mimir",pod="ruler-0",user="tenant-1"}
        values: 0+15x80
      - series: cortex_ruler_write_requests_failed_total{cluster="c1",namespace="mimir",pod="ruler-0",user="tenant-1"}
        values: 0+3x80
    alert_rule_test:
      - eval_time: 15m
        alertname: MimirRulerTooManyFailedPushes
        exp_alerts:
          - exp_labels:
              severity: critical
              cluster: c1
              namespace: mimir
              pod: ruler-0
            exp_annotations:
              message: "Mimir Ruler ruler-0 in c1/mimir is experiencing 20.00% write (push) errors.\n"
              runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimirrulertoomanyfailedpushes
  - name: client errors alone do not fire
    interval: 15s
    input_series:
      - series: cortex_ruler_write_requests_total{cluster="c1",namespace="mimir",pod="ruler-0",user="tenant-1"}
        values: 0+15x80
      - series: cortex_ruler_write_requests_failed_total{cluster="c1",namespace="mimir",pod="ruler-0",user="tenant-1",reason="client_error"}
        values: 0+3x80
    alert_rule_test:
      - eval_time: 15m
        alertname: MimirRulerTooManyFailedPushes
        exp_alerts: []
  - name: exactly one percent does not fire
    interval: 15s
    input_series:
      - series: cortex_ruler_write_requests_total{cluster="c1",namespace="mimir",pod="ruler-0",user="tenant-1"}
        values: 0+1500x80
      - series: cortex_ruler_write_requests_failed_total{cluster="c1",namespace="mimir",pod="ruler-0",user="tenant-1",reason="server_error"}
        values: 0+15x80
    alert_rule_test:
      - eval_time: 15m
        alertname: MimirRulerTooManyFailedPushes
        exp_alerts: []
  - name: healthy ruler does not fire
    interval: 15s
    input_series:
      - series: cortex_ruler_write_requests_total{cluster="c1",namespace="mimir",pod="ruler-0",user="tenant-1"}
        values: 0+15x80
    alert_rule_test:
      - eval_time: 15m
        alertname: MimirRulerTooManyFailedPushes
        exp_alerts: []
