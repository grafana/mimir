syntax = "proto3";
package cortexpb;

message WriteRequest {
  repeated TimeSeries timeseries = 1;
  SourceEnum source = 2;
  repeated MetricMetadata metadata = 3;
  repeated string symbolsRW2 = 4;
  repeated TimeSeriesRW2 timeseriesRW2 = 5;
  enum SourceEnum { API = 0; RULE = 1; OTLP = 2; }
}
message WriteResponse {}
message LabelPair { bytes name = 1; bytes value = 2; }
message Sample { double value = 1; int64 timestamp_ms = 2; }
message TimeSeries {
  repeated LabelPair labels = 1;
  repeated Sample samples = 2;
  repeated Exemplar exemplars = 3;
  repeated Histogram histograms = 4;
  int64 created_timestamp = 6;
}
message MetricMetadata {
  MetricType type = 1;
  string metric_family_name = 2;
  string help = 4;
  string unit = 5;
  enum MetricType { UNKNOWN = 0; COUNTER = 1; GAUGE = 2; HISTOGRAM = 3; GAUGEHISTOGRAM = 4; SUMMARY = 5; INFO = 6; STATESET = 7; }
}
message Metric { repeated LabelPair labels = 1; }
message Exemplar { repeated LabelPair labels = 1; double value = 2; int64 timestamp_ms = 3; }
message BucketSpan { sint32 offset = 1; uint32 length = 2; }
message Histogram {
  oneof count { uint64 count_int = 1; double count_float = 2; }
  double sum = 3;
  sint32 schema = 4;
  double zero_threshold = 5;
  oneof zero_count { uint64 zero_count_int = 6; double zero_count_float = 7; }
  repeated BucketSpan negative_spans = 8;
  repeated sint64 negative_deltas = 9;
  repeated double negative_counts = 10;
  repeated BucketSpan positive_spans = 11;
  repeated sint64 positive_deltas = 12;
  repeated double positive_counts = 13;
  ResetHint reset_hint = 14;
  int64 timestamp = 15;
  repeated double custom_values = 16;
  enum ResetHint { UNKNOWN = 0; YES = 1; NO = 2; GAUGE = 3; }
}

message TimeSeriesRW2 {
  repeated uint32 labels_refs = 1;
  repeated Sample samples = 2;
  repeated Histogram histograms = 3;
  repeated ExemplarRW2 exemplars = 4;
  MetadataRW2 metadata = 5;
  int64 created_timestamp = 6;
}
message ExemplarRW2 { repeated uint32 labels_refs = 1; double value = 2; int64 timestamp = 3; }
message MetadataRW2 {
  MetricType type = 1;
  uint32 help_ref = 3;
  uint32 unit_ref = 4;
  enum MetricType { METRIC_TYPE_UNSPECIFIED = 0; METRIC_TYPE_COUNTER = 1; METRIC_TYPE_GAUGE = 2; METRIC_TYPE_HISTOGRAM = 3; METRIC_TYPE_GAUGEHISTOGRAM = 4; METRIC_TYPE_SUMMARY = 5; METRIC_TYPE_INFO = 6; METRIC_TYPE_STATESET = 7; }
}
