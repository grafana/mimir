name: Sync upstream PromQL test cases

# On-demand helper for the automated mimir-prometheus vendoring: when a "Update mimir-prometheus
# dependency" PR fails TestOurUpstreamTestCasesAreInSyncWithUpstream / TestUpstreamTestCases, run this
# by hand against that PR's branch. It re-syncs pkg/streamingpromql/testdata/upstream with the vendored
# upstream test cases and comments out the ones Mimir's engine fails, pushing the result to the branch
# as two verified commits (re-sync, then disable). Intended to be wired into the vendoring workflow
# automatically once proven. See tools/sync-upstream-promql-tests/README.md for how to use it.
#
# The work is split across jobs so that the job running code from the branch (including newly vendored
# upstream code) has no write access or OIDC token, and the job holding credentials never runs it.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to sync (the failing bot/main/update-mimir-prometheus-* PR branch)'
        required: true
        type: string

permissions: {}

concurrency:
  # Two runs on the same branch would race on its head; queue them rather than cancel one mid-commit.
  group: ${{ github.workflow }}-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # The collaborator-permission lookup requires the token to have repo write privilege.
      contents: write
    outputs:
      head_sha: ${{ steps.authorize.outputs.head_sha }}
    steps:
      - name: Authorize
        id: authorize
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          BRANCH: ${{ inputs.branch }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Only main's vendoring branches (release branches don't have these tools), in the exact format the
          # vendoring workflow creates, so no unexpected input reaches the API calls below.
          if [[ ! "$BRANCH" =~ ^bot/main/update-mimir-prometheus-[0-9a-f]{12}-[0-9]{12}$ ]]; then
            echo "::error::Branch '$BRANCH' is not an automated mimir-prometheus vendoring branch for main (expected bot/main/update-mimir-prometheus-<12 hex>-<YYYYMMDDHHMM>)."
            exit 1
          fi

          # Check both: on a re-run, github.actor stays the original triggerer and its privileges apply.
          for user in "$ACTOR" "$TRIGGERING_ACTOR"; do
            perm=$(gh api "repos/$REPO/collaborators/$user/permission" --jq '.permission') \
              || { echo "::error::Could not determine $user's permission on $REPO."; exit 1; }
            case "$perm" in
              admin | maintain) ;;
              *)
                echo "::error::$user must have 'maintain' or 'admin' permission on $REPO to run this workflow (has '$perm')."
                exit 1
                ;;
            esac
          done

          # The branch must belong to an open PR opened by the vendoring bot, so this only ever acts on a real
          # vendoring PR rather than a same-named branch someone else created.
          prs=$(gh api -X GET "repos/$REPO/pulls" -f head="${REPO%%/*}:$BRANCH" -f state=open)
          pr=$(jq -c '[.[] | select(.user.login == "mimir-vendoring[bot]" and any(.labels[]; .name == "vendored-mimir-prometheus-update"))] | if length == 1 then .[0] else empty end' <<<"$prs")
          if [ -z "$pr" ]; then
            echo "::error::$BRANCH is not the head of exactly one open PR opened by mimir-vendoring[bot] with the vendored-mimir-prometheus-update label."
            exit 1
          fi

          # Pin the commit the later jobs operate on, so a push to the branch after this check can't change
          # what runs or what gets committed (ghcommit also refuses to commit onto a moved branch head).
          head_sha=$(jq -r '.head.sha' <<<"$pr")

          # Refuse if the branch has any commit not made by the bot. The bot's commits would make it the
          # last pusher, letting a human who pushed earlier commits approve their own changes.
          compare=$(gh api "repos/$REPO/compare/main...$head_sha")
          if [ "$(jq '.total_commits' <<<"$compare")" -ne "$(jq '.commits | length' <<<"$compare")" ]; then
            echo "::error::Too many commits on $BRANCH to verify their authors."
            exit 1
          fi
          others=$(jq -r '.commits[]
            | select(.author.login != "mimir-vendoring[bot]" or .committer.login != "web-flow" or .commit.verification.verified != true)
            | "\(.sha[0:12]) \(.author.login // .commit.author.name)"' <<<"$compare")
          if [ -n "$others" ]; then
            echo "::error::$BRANCH has commits not made by mimir-vendoring[bot]. Run the tools locally instead (make sync-upstream-promql-tests disable-failing-upstream-promql-tests) so the PR gets an independent review (see tools/sync-upstream-promql-tests/README.md):"
            echo "$others"
            exit 1
          fi

          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

  generate:
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Runs code from the branch, so it gets read-only access and no OIDC token. Its only output is the
    # regenerated testdata and report, committed by the next job.
    permissions:
      contents: read
    steps:
      - name: Check out the authorized commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.authorize.outputs.head_sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: "1.26.7"
          cache: false

      - name: Re-sync upstream PromQL test cases
        env:
          MIMIR_SYNC_REPORT: ${{ runner.temp }}/report/sync-report.md
          MIMIR_SYNC_BASELINE_DIR: ${{ runner.temp }}/upstream-baseline
        run: |
          mkdir -p "$(dirname "$MIMIR_SYNC_REPORT")"
          touch "$MIMIR_SYNC_REPORT"
          # Snapshot the pre-sync copies so the disabling step can tell new upstream cases from
          # previously-passing ones.
          cp -a pkg/streamingpromql/testdata/upstream "$MIMIR_SYNC_BASELINE_DIR"
          (cd tools/sync-upstream-promql-tests && go run .)
          cp -a pkg/streamingpromql/testdata/upstream "$RUNNER_TEMP/after-resync"

      - name: Disable failing upstream PromQL test cases
        env:
          MIMIR_SYNC_REPORT: ${{ runner.temp }}/report/sync-report.md
          MIMIR_SYNC_DISABLED: ${{ runner.temp }}/report/disabled-cases.md
          MIMIR_SYNC_BASELINE_DIR: ${{ runner.temp }}/upstream-baseline
        run: |
          cd tools/disable-failing-upstream-promql-tests && go run .

      - name: Upload re-synced test cases
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: after-resync
          path: ${{ runner.temp }}/after-resync
          retention-days: 1

      - name: Upload test cases after disabling
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: after-disable
          path: pkg/streamingpromql/testdata/upstream
          retention-days: 1

      - name: Upload sync report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sync-report
          path: ${{ runner.temp }}/report
          retention-days: 1

  commit:
    needs: [authorize, generate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Never runs code from the branch: it only commits the files the previous job produced.
    permissions:
      # The collaborator-permission lookup requires the token to have repo write privilege.
      contents: write
      # create-github-app-token gets the app credentials from Vault via OIDC.
      id-token: write
      # For commenting the report on the PR (as github-actions[bot], via the default token).
      pull-requests: write
    env:
      UPSTREAM_DIR: pkg/streamingpromql/testdata/upstream
    steps:
      # "Re-run failed jobs" doesn't re-run the authorize job, so check again here whoever started this
      # attempt, before any credential is minted.
      - name: Re-check who is running this
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for user in "$ACTOR" "$TRIGGERING_ACTOR"; do
            perm=$(gh api "repos/$REPO/collaborators/$user/permission" --jq '.permission') \
              || { echo "::error::Could not determine $user's permission on $REPO."; exit 1; }
            case "$perm" in
              admin | maintain) ;;
              *)
                echo "::error::$user must have 'maintain' or 'admin' permission on $REPO to run this workflow (has '$perm')."
                exit 1
                ;;
            esac
          done

      # Use the mimir-vendoring app (not GITHUB_TOKEN) so the pushed commits are verified and re-trigger
      # the branch's CI.
      - name: Generate GitHub App Token
        id: app-token
        uses: grafana/shared-workflows/actions/create-github-app-token@46f48da11e78ebdba7a8747ae456b11062fac83e # create-github-app-token/v0.3.1
        with:
          github_app: mimir-vendoring
          permission_set: main

      # ghcommit uses the checked-out HEAD as the expected branch head, so checking out the pinned commit
      # makes the commit fail if the branch moved since authorization.
      - name: Check out the authorized commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.authorize.outputs.head_sha }}
          set-safe-directory: '*'
          persist-credentials: false

      - name: Download re-synced test cases
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: after-resync
          path: ${{ runner.temp }}/after-resync

      - name: Download test cases after disabling
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: after-disable
          path: ${{ runner.temp }}/after-disable

      - name: Download sync report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sync-report
          path: ${{ runner.temp }}/report

      # The artifacts come from a job that runs code from the branch, so only accept what the tools can
      # legitimately produce: a flat directory of test case files.
      - name: Validate downloaded test cases
        run: |
          set -euo pipefail
          for dir in "$RUNNER_TEMP/after-resync" "$RUNNER_TEMP/after-disable"; do
            unexpected=$(find "$dir" -mindepth 1 \( ! -type f -o -path "$dir/*/*" -o ! \( -name '*.test' -o -name '*.test.disabled' -o -name README.md \) \) -print)
            if [ -n "$unexpected" ]; then
              echo "::error::Unexpected entries in the $(basename "$dir") artifact:"
              echo "$unexpected"
              exit 1
            fi
          done

      - name: Stage re-synced test cases
        run: |
          rm -rf "$UPSTREAM_DIR"
          cp -r "$RUNNER_TEMP/after-resync" "$UPSTREAM_DIR"

      # Commit 1, signed and verified via the GitHub API (a plain git push would be unverified and
      # blocked by branch protection).
      - name: Commit re-sync
        id: commit-resync
        uses: planetscale/ghcommit-action@a6b150b81dca5dd027baa898604418eec9e11465 # v0.2.22
        with:
          commit_message: Re-sync upstream PromQL test cases
          repo: ${{ github.repository }}
          branch: ${{ inputs.branch }}
          file_pattern: pkg/streamingpromql/testdata/upstream/*
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      # Move HEAD to commit 1 so commit 2 goes on top of it (and fails if anything else was pushed).
      - name: Check out the re-sync commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # commit-hash is empty when there was nothing to re-sync.
          ref: ${{ steps.commit-resync.outputs.commit-hash || needs.authorize.outputs.head_sha }}
          set-safe-directory: '*'
          persist-credentials: false

      - name: Stage test cases after disabling
        run: |
          rm -rf "$UPSTREAM_DIR"
          cp -r "$RUNNER_TEMP/after-disable" "$UPSTREAM_DIR"

      # Commit 2 (only pushes if the disabling step changed anything), same verified path.
      - name: Commit disabled cases
        uses: planetscale/ghcommit-action@a6b150b81dca5dd027baa898604418eec9e11465 # v0.2.22
        with:
          commit_message: Disable upstream PromQL test cases unsupported by Mimir's engine
          repo: ${{ github.repository }}
          branch: ${{ inputs.branch }}
          file_pattern: pkg/streamingpromql/testdata/upstream/*
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      # Surface the report on the PR so the maintainer who ran this sees what was disabled without
      # opening the run logs. Only on success: after a partial failure it could describe changes that
      # didn't land (the notify-failure job comments instead).
      - name: Comment sync report on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ inputs.branch }}
          REPORT: ${{ runner.temp }}/report/sync-report.md
        run: |
          set -euo pipefail
          if [ ! -s "$REPORT" ]; then
            echo "No sync report; not commenting."
            exit 0
          fi
          {
            echo "## Upstream PromQL test-case sync"
            echo
            cat "$REPORT"
          } > "$RUNNER_TEMP/comment.md"
          gh pr comment "$BRANCH" --body-file "$RUNNER_TEMP/comment.md"

      - name: Summarize what was synced
        if: always()
        env:
          REPORT: ${{ runner.temp }}/report/sync-report.md
        run: |
          {
            echo "## Upstream PromQL test-case sync"
            if [ -s "$REPORT" ]; then cat "$REPORT"; else echo "Nothing to report - all cases already in sync and passing."; fi
          } >> "$GITHUB_STEP_SUMMARY"

  notify-failure:
    needs: [authorize, generate, commit]
    # Only for authorized runs started by the original actor: an unauthorized dispatch, or someone else's
    # "Re-run failed jobs" (which skips authorize and then fails in commit), can't make this comment.
    if: failure() && needs.authorize.result == 'success' && github.triggering_actor == github.actor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Comment on the PR that the sync failed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ inputs.branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh pr comment "$BRANCH" --body "The upstream PromQL test-case sync failed, see $RUN_URL. Any commit it already pushed stays on the branch. If it failed after pushing a commit, start a new run (or use Re-run all jobs) rather than Re-run failed jobs, which reuses the branch head this run started from."
