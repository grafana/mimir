name: Sync upstream PromQL test cases

# On-demand helper for the automated mimir-prometheus vendoring: when a "Update mimir-prometheus
# dependency" PR fails TestOurUpstreamTestCasesAreInSyncWithUpstream / TestUpstreamTestCases, run this
# by hand against that PR's branch. It re-syncs pkg/streamingpromql/testdata/upstream with the vendored
# upstream test cases and comments out the ones Mimir's engine fails, pushing the result to the branch
# as two verified commits (re-sync, then disable). Intended to be wired into the vendoring workflow
# automatically once proven.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to sync (e.g. the failing vendored-mimir-prometheus PR branch)'
        required: true
        type: string

permissions:
  # contents: write (not read) because the Authorize step's collaborator-permission lookup requires
  # the token to have repo write privilege.
  contents: write
  id-token: write
  pull-requests: write

jobs:
  sync-upstream-promql-tests:
    runs-on: ubuntu-latest
    steps:
      # Gate before any privileged step runs: only repo maintainers/admins, and only the automated
      # mimir-prometheus vendoring branches (so this can't be pointed at main or an arbitrary branch).
      - name: Authorize
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ inputs.branch }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          case "$BRANCH" in
            bot/*/update-mimir-prometheus-*) ;;
            *)
              echo "::error::Branch '$BRANCH' is not an automated mimir-prometheus vendoring branch (must match 'bot/*/update-mimir-prometheus-*')."
              exit 1
              ;;
          esac
          perm=$(gh api "repos/$REPO/collaborators/$ACTOR/permission" --jq '.permission') \
            || { echo "::error::Could not determine $ACTOR's permission on $REPO."; exit 1; }
          echo "$ACTOR has '$perm' permission on $REPO."
          case "$perm" in
            admin | maintain) ;;
            *)
              echo "::error::$ACTOR must have 'maintain' or 'admin' permission on $REPO to run this workflow (has '$perm')."
              exit 1
              ;;
          esac

      # Use the mimir-vendoring app (not GITHUB_TOKEN) so the pushed commits are verified and re-trigger
      # the branch's CI.
      - name: Generate GitHub App Token
        id: app-token
        uses: grafana/shared-workflows/actions/create-github-app-token@46f48da11e78ebdba7a8747ae456b11062fac83e # create-github-app-token/v0.3.1
        with:
          github_app: mimir-vendoring
          permission_set: ${{ github.ref == 'refs/heads/main' && 'main' || 'release' }}

      - name: Check out the branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ inputs.branch }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          set-safe-directory: '*'
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: "1.26.7"
          cache: false

      - name: Re-sync upstream PromQL test cases
        env:
          MIMIR_SYNC_REPORT: ${{ runner.temp }}/sync-report.md
          MIMIR_SYNC_BASELINE_DIR: ${{ runner.temp }}/upstream-baseline
        run: |
          # Snapshot the pre-sync copies so the disabling step can tell new upstream cases from
          # previously-passing ones.
          cp -a pkg/streamingpromql/testdata/upstream "$MIMIR_SYNC_BASELINE_DIR"
          cd tools/sync-upstream-promql-tests && go run .

      # Commit 1, signed and verified via the GitHub API (a plain git push would be unverified and
      # blocked by branch protection).
      - name: Commit re-sync
        uses: planetscale/ghcommit-action@a6b150b81dca5dd027baa898604418eec9e11465 # v0.2.22
        with:
          commit_message: Re-sync upstream PromQL test cases
          repo: ${{ github.repository }}
          branch: ${{ inputs.branch }}
          file_pattern: pkg/streamingpromql/testdata/upstream/*
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      # Re-checkout so the working tree matches commit 1 before the disabling step runs and commits 2.
      - name: Check out the updated branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ inputs.branch }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          set-safe-directory: '*'
          persist-credentials: false

      - name: Disable failing upstream PromQL test cases
        env:
          MIMIR_SYNC_REPORT: ${{ runner.temp }}/sync-report.md
          MIMIR_SYNC_DISABLED: ${{ runner.temp }}/disabled-cases.md
          MIMIR_SYNC_BASELINE_DIR: ${{ runner.temp }}/upstream-baseline
        run: |
          cd tools/disable-failing-upstream-promql-tests && go run .

      # Commit 2 (only pushes if the disabling step changed anything), same verified path.
      - name: Commit disabled cases
        uses: planetscale/ghcommit-action@a6b150b81dca5dd027baa898604418eec9e11465 # v0.2.22
        with:
          commit_message: Disable upstream PromQL test cases unsupported by Mimir's engine
          repo: ${{ github.repository }}
          branch: ${{ inputs.branch }}
          file_pattern: pkg/streamingpromql/testdata/upstream/*
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      # Surface the report on the PR (as github-actions[bot], via the default token) so the maintainer
      # who ran this sees what was disabled without opening the run logs.
      - name: Comment sync report on the PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ inputs.branch }}
          REPORT: ${{ runner.temp }}/sync-report.md
        run: |
          set -euo pipefail
          if [ ! -s "$REPORT" ]; then
            echo "No sync report; not commenting."
            exit 0
          fi
          {
            echo "## Upstream PromQL test-case sync"
            echo
            cat "$REPORT"
          } > comment.md
          gh pr comment "$BRANCH" --body-file comment.md

      - name: Summarize what was synced
        if: always()
        env:
          REPORT: ${{ runner.temp }}/sync-report.md
        run: |
          {
            echo "## Upstream PromQL test-case sync"
            if [ -s "$REPORT" ]; then cat "$REPORT"; else echo "Nothing to report - all cases already in sync and passing."; fi
          } >> "$GITHUB_STEP_SUMMARY"
