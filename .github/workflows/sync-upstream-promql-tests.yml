name: Sync upstream PromQL test cases

# When the vendoring bot opens a "[main] Update mimir-prometheus to ..." PR, re-sync
# pkg/streamingpromql/testdata/upstream with the vendored upstream test cases, so the PR doesn't fail
# TestOurUpstreamTestCasesAreInSyncWithUpstream. Cases that then fail TestUpstreamTestCases are not
# disabled automatically: someone on the MQE team decides. See tools/sync-upstream-promql-tests/README.md.
#
# This runs code from the PR (including newly vendored upstream code), so it has read-only access and no
# secrets, and only uploads the results. commit-synced-upstream-promql-tests.yml then runs from main,
# checks the results and pushes them to the PR.

on:
  pull_request:
    # The vendoring workflow creates a new branch for each update, so later pushes to one come from a
    # human or from the commit workflow, and must not trigger another sync.
    types: [opened, reopened]
    branches: [main]

permissions: {}

jobs:
  generate:
    # Only the vendoring bot's PRs, from the branches the vendoring workflow creates for main (release
    # branches may not have these tools).
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'mimir-vendoring[bot]' &&
      startsWith(github.event.pull_request.head.ref, 'bot/main/update-mimir-prometheus-')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      # The PR head rather than the merge commit: the results are committed on top of it.
      - name: Check out the PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: "1.26.7"
          cache: false

      - name: Re-sync upstream PromQL test cases
        env:
          MIMIR_SYNC_REPORT: ${{ runner.temp }}/report/sync-report.md
        run: |
          mkdir -p "$(dirname "$MIMIR_SYNC_REPORT")"
          touch "$MIMIR_SYNC_REPORT"
          (cd tools/sync-upstream-promql-tests && go run .)

      - name: Upload re-synced test cases
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: after-resync
          path: pkg/streamingpromql/testdata/upstream
          retention-days: 1

      - name: Upload sync report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sync-report
          path: ${{ runner.temp }}/report
          retention-days: 1
