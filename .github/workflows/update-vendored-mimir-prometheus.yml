name: Update mimir-prometheus dependency

on:
  workflow_dispatch:
    inputs:
      mimir_branch:
        description: 'Mimir branch to update'
        required: true
        default: 'main'
        type: string
      mimir_prometheus_branch:
        description: 'mimir-prometheus branch/commit to update to'
        required: true
        default: 'main'
        type: string

  repository_dispatch:
    types: [ mimir-prometheus-branch-push ]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  update-mimir-prometheus:
    runs-on: ubuntu-latest
    steps:
      - name: Determine branch names (repository_dispatch)
        id: branch-names-dispatch
        if: github.event_name == 'repository_dispatch'
        env:
          MIMIR_PROMETHEUS_BRANCH: ${{ github.event.client_payload.branch_name }}
        run: |
          # For repository_dispatch, use the env-injected mimir_prometheus_branch.
          # The main use case is for weekly branches, so we just use the same branch name here too.
          echo "Triggered by repository_dispatch"
          echo "Using mimir-prometheus branch from payload: $MIMIR_PROMETHEUS_BRANCH"
          
          echo "mimir_branch=$MIMIR_PROMETHEUS_BRANCH" >> $GITHUB_OUTPUT
          echo "mimir_prometheus_branch=$MIMIR_PROMETHEUS_BRANCH" >> $GITHUB_OUTPUT

      - name: Determine branch names (workflow_dispatch)
        id: branch-names-manual
        if: github.event_name == 'workflow_dispatch'
        env:
          MIMIR_BRANCH: ${{ inputs.mimir_branch }}
          MIMIR_PROMETHEUS_BRANCH: ${{ inputs.mimir_prometheus_branch }}
        run: |
          # For workflow_dispatch, use the env-injected branch names.
          echo "Triggered by workflow_dispatch"
          echo "Using input values - mimir branch: $MIMIR_BRANCH, mimir-prometheus branch: $MIMIR_PROMETHEUS_BRANCH"

          echo "mimir_branch=$MIMIR_BRANCH" >> $GITHUB_OUTPUT
          echo "mimir_prometheus_branch=$MIMIR_PROMETHEUS_BRANCH" >> $GITHUB_OUTPUT

      - name: Determine branch names (combined)
        id: branch-names
        env:
          DISPATCH_MIMIR_BRANCH: ${{ steps.branch-names-dispatch.outputs.mimir_branch }}
          MANUAL_MIMIR_BRANCH: ${{ steps.branch-names-manual.outputs.mimir_branch }}
          DISPATCH_MIMIR_PROMETHEUS_BRANCH: ${{ steps.branch-names-dispatch.outputs.mimir_prometheus_branch }}
          MANUAL_MIMIR_PROMETHEUS_BRANCH: ${{ steps.branch-names-manual.outputs.mimir_prometheus_branch }}
        run: |
          echo "mimir_branch=${DISPATCH_MIMIR_BRANCH:-$MANUAL_MIMIR_BRANCH}" >> "$GITHUB_OUTPUT"
          echo "mimir_prometheus_branch=${DISPATCH_MIMIR_PROMETHEUS_BRANCH:-$MANUAL_MIMIR_PROMETHEUS_BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ steps.branch-names.outputs.mimir_branch }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          set-safe-directory: '*'
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          # Keep in line with go.mod: the upstream PromQL test case sync below builds a tool from this repository,
          # and doesn't download a newer Go if go.mod asks for one.
          go-version: "1.27.3"
          # Nothing worth caching from `go mod` or the small sync tool, and it competes for the cache quota.
          cache: false

      # This job uses "mimir-vendoring bot" instead of "github-actions bot" (secrets.GITHUB_TOKEN)
      # because any events triggered by the later don't spawn GitHub actions.
      # Refer to https://docs.github.com/en/actions/security-for-github-actions/security-guides/automatic-token-authentication#using-the-github_token-in-a-workflow
      - name: Generate GitHub App Token
        id: app-token
        uses: grafana/shared-workflows/actions/create-github-app-token@46f48da11e78ebdba7a8747ae456b11062fac83e # create-github-app-token/v0.3.1
        with:
          github_app: mimir-vendoring
          permission_set: ${{ github.ref == 'refs/heads/main' && 'main' || 'release' }}

      - name: Get mimir-prometheus commit info
        id: get-commit-info
        env:
          MIMIR_PROMETHEUS_BRANCH: ${{ steps.branch-names.outputs.mimir_prometheus_branch }}
        run: |
          # Fetch the latest commit hash from the specified branch
          NEW_HASH=$(git ls-remote https://github.com/grafana/mimir-prometheus.git "${MIMIR_PROMETHEUS_BRANCH}" | cut -f1)
          if [ -z "$NEW_HASH" ]; then
            echo "Error: Could not find commit hash for branch/ref ${MIMIR_PROMETHEUS_BRANCH}"
            exit 1
          fi
          
          # Get current mimir-prometheus version from go.mod
          OLD_HASH=$(go mod edit -json | jq -r '.Replace[] | select(.New.Path == "github.com/grafana/mimir-prometheus") | .New.Version | .[-12:]')
          if [ -z "OLD_HASH" ] || [ "OLD_HASH" = "null" ]; then
            echo "No current mimir-prometheus version found in go.mod"
            OLD_HASH=""
          fi
          
          
          # Get short commit hash for display
          SHORT_HASH=${NEW_HASH:0:12}
          
          # Create timestamp for branch naming so that multiple runs don't clobber each other
          TIMESTAMP=$(date +%Y%m%d%H%M)
          
          echo "old_hash=$OLD_HASH" >> $GITHUB_OUTPUT
          echo "new_hash=$NEW_HASH" >> $GITHUB_OUTPUT
          echo "short_hash=$SHORT_HASH" >> $GITHUB_OUTPUT
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT
          
          echo "Found commit: $NEW_HASH"
          echo "Current mimir-prometheus hash: $CURRENT_VERSION"

      - name: Update go.mod
        run: |
          # Update the replace directive in go.mod using go mod edit with commit hash
          go mod edit -replace=github.com/prometheus/prometheus=github.com/grafana/mimir-prometheus@${{ steps.get-commit-info.outputs.new_hash }}
          
          echo "Updated go.mod with new mimir-prometheus commit: ${{ steps.get-commit-info.outputs.new_hash }}"

      - name: Update dependencies
        run: |
          echo "Tidying go.mod and updating vendor directory..."
          go mod tidy
          go mod vendor
          
          echo "Dependencies updated successfully"

      # Committed here so that the re-synced test cases below get a commit of their own. create-pull-request
      # recreates both commits as signed commits by the app, so the identity used here is replaced.
      - name: Commit the dependency update
        env:
          SHORT_HASH: ${{ steps.get-commit-info.outputs.short_hash }}
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
          else
            git -c user.name='mimir-vendoring[bot]' -c user.email='mimir-vendoring[bot]@users.noreply.github.com' \
              commit -q -m "Update mimir-prometheus to \`$SHORT_HASH\`"
          fi

      # Vendoring often changes the upstream PromQL test cases, which then makes the PR fail
      # TestOurUpstreamTestCasesAreInSyncWithUpstream until our copies are re-synced. This re-syncs them before
      # the PR is created, so its first CI run sees them in sync. Disabling cases that then fail is left to
      # the MQE team (see trigger-disable-failing-upstream-promql-tests.yml).
      #
      # This job holds the app token, so it must only run code that has been reviewed:
      # - only from branches that need an approved PR to change, and
      # - only if the sync tool depends on nothing but the standard library and Mimir, as anything else may
      #   have just been updated by the vendoring above. The tool's tests check this too.
      # Neither `go list` nor the checks run any code from the repository.
      - name: Re-sync upstream PromQL test cases
        id: sync
        env:
          MIMIR_BRANCH: ${{ steps.branch-names.outputs.mimir_branch }}
          MIMIR_SYNC_REPORT: ${{ runner.temp }}/sync-report.md
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GOTOOLCHAIN: local
        run: |
          set -uo pipefail
          tool=tools/sync-upstream-promql-tests
          testdata=pkg/streamingpromql/testdata/upstream
          readme=https://github.com/grafana/mimir/blob/main/tools/sync-upstream-promql-tests/README.md#fixing-a-failing-mimir-prometheus-vendoring-pr
          summary="$RUNNER_TEMP/sync-summary.md"
          : > "$summary"

          # The PR description includes this summary, after the vendoring details.
          finish() {
            delimiter="EOF_$(openssl rand -hex 16)"
            { echo "summary<<$delimiter"; cat "$summary"; echo "$delimiter"; } >> "$GITHUB_OUTPUT"
            exit 0
          }
          not_synced() {
            echo "::warning::Upstream PromQL test cases not re-synced: $1"
            printf "### Upstream PromQL test cases\n\nNot re-synced: %s. If \`TestOurUpstreamTestCasesAreInSyncWithUpstream\` fails, see [Fixing a failing mimir-prometheus vendoring PR](%s).\n" "$1" "$readme" > "$summary"
            finish
          }

          # Matches the branch protection rules (main, release*, r[0-9][0-9][0-9]).
          if [[ ! "$MIMIR_BRANCH" =~ ^(main|release[^/]*|r[0-9]{3})$ ]]; then
            not_synced "the target branch is not a protected branch, so its code is not run here"
          fi
          if [ ! -d "$tool" ]; then
            not_synced "the target branch doesn't have the sync tool"
          fi
          if ! deps=$(go list -deps -f '{{if not .Standard}}{{.ImportPath}}{{end}}' "./$tool"); then
            not_synced "could not check the sync tool's dependencies, see the [workflow run]($RUN_URL)"
          fi
          # Dots escaped so that only Mimir's own path matches. Blank lines are ignored, as they name no package.
          if grep -qvE '^(github\.com/grafana/mimir/|$)' <<<"$deps"; then
            not_synced "the sync tool depends on packages outside the standard library and Mimir, see the [workflow run]($RUN_URL)"
          fi

          if ! (cd "$tool" && go run .); then
            # Don't commit a partial sync.
            git checkout -q -- "$testdata"
            git clean -fdq -- "$testdata"
            not_synced "the sync tool failed, see the [workflow run]($RUN_URL)"
          fi

          if [ -n "$(git status --porcelain -- "$testdata")" ]; then
            {
              printf "### Upstream PromQL test cases\n\nRe-synced our copies in \`%s\` with the vendored upstream test cases, in a separate commit.\n\n" "$testdata"
              if [ -s "$MIMIR_SYNC_REPORT" ]; then cat "$MIMIR_SYNC_REPORT"; echo; fi
              # Only the main branch's vendoring PRs can have failing cases disabled by the bot.
              if [ "$MIMIR_BRANCH" = main ]; then
                cat <<'EOF'
          If `TestUpstreamTestCases` now fails, someone on the MQE team can preview which cases would be disabled with `make disable-failing-upstream-promql-tests MIMIR_SYNC_BASELINE_REF=origin/main` on this branch, and if that is acceptable, comment `/disable-failing-upstream-promql-tests` on this PR to have the bot disable them.
          EOF
              fi
              printf 'See [Fixing a failing mimir-prometheus vendoring PR](%s).\n' "$readme"
            } > "$summary"
          fi
          finish

      - name: Create Pull Request
        id: create_pull_request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          sign-commits: true
          title: '[${{ steps.branch-names.outputs.mimir_branch }}] Update mimir-prometheus to ${{ steps.get-commit-info.outputs.short_hash }}'
          body: |
            ## Update mimir-prometheus dependency

            *This PR was automatically created by the [update-vendored-mimir-prometheus.yml](https://github.com/grafana/mimir/blob/main/.github/workflows/update-vendored-mimir-prometheus.yml) workflow.*

            ### Details:
            - **Source branch/ref**: ${{ format('[`{0}`](https://github.com/grafana/mimir-prometheus/tree/{0})', steps.branch-names.outputs.mimir_prometheus_branch) }}
            - **Previous commit**: ${{ format('[`{0}`](https://github.com/grafana/mimir-prometheus/commit/{0})', steps.get-commit-info.outputs.old_hash) }}
            - **New commit**: ${{ format('[`{0}`](https://github.com/grafana/mimir-prometheus/commit/{0})', steps.get-commit-info.outputs.new_hash) }}
            - **Changes**: ${{ format('[`{0}...{1}`](https://github.com/grafana/mimir-prometheus/compare/{0}...{1})', steps.get-commit-info.outputs.old_hash, steps.get-commit-info.outputs.new_hash) }}

            ${{ steps.sync.outputs.summary }}
          # The dependency update is already committed, so this is only used for the re-synced test cases.
          commit-message: Re-sync upstream PromQL test cases
          branch: bot/${{ steps.branch-names.outputs.mimir_branch }}/update-mimir-prometheus-${{ steps.get-commit-info.outputs.short_hash }}-${{ steps.get-commit-info.outputs.timestamp }}
          base: ${{ steps.branch-names.outputs.mimir_branch }}
          labels: vendored-mimir-prometheus-update
          delete-branch: true

      - name: Close Old Vendor PRs
        run: |
          prs=$(gh pr list --state open --json number --search 'label:vendored-mimir-prometheus-update' --base $BASE_BRANCH --jq '.[].number')
          echo "The following Mimir automatic vendor PRs are open: $prs"
          for pr in $prs; do
            if [ $pr == ${PULL_REQUEST_NUMBER} ]; then
              continue
            fi
            gh pr comment $pr -b "This pull request has been automatically closed because it has been superseded by #${PULL_REQUEST_NUMBER}."
            gh pr close $pr --delete-branch
          done
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          BASE_BRANCH: ${{ steps.branch-names.outputs.mimir_branch }}
          PULL_REQUEST_NUMBER: ${{ steps.create_pull_request.outputs.pull-request-number }}

      - name: Send Slack notification on failure
        if: failure()
        uses: grafana/shared-workflows/actions/send-slack-message@551bc8d50017d3e95d5da3f8a4826e733a208dc0 # send-slack-message/v3.0.2
        with:
          method: chat.postMessage
          payload: |
            {
              "channel": "C04AF91LPFX",
              "text": ":sadcomputer: *Automated vendoring of mimir-prometheus into Mimir has failed.*\n<!subteam^S03C2P8659U> please check the <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|workflow logs> and coordinate fixes for any issues."
            }
