name: Regenerate docs and helm tests

on:
  pull_request:
    types: [opened, synchronize]
    paths: ['operations/helm/**']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prepare:
    if: ${{ !github.event.pull_request.head.repo.fork && github.event.pull_request.user.login == 'renovate[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Get build image from Makefile
        id: build_image_step
        run: echo "build_image=$(make print-build-image)" >> "$GITHUB_OUTPUT"
    outputs:
      build_image: ${{ steps.build_image_step.outputs.build_image }}

  lint_and_update:
    runs-on: ubuntu-latest
    needs: prepare
    container:
      image: ${{ needs.prepare.outputs.build_image }} # zizmor: ignore[unpinned-images] Pinned by digest in Makefile.
    outputs:
      has_changes: ${{ steps.check_updates.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Mark workspace as safe
        run: git config --global --add safe.directory '*'
      - name: Regenerate docs and helm tests
        run: make BUILD_IN_CONTAINER=false doc build-helm-tests
      - name: Check for changes
        id: check_updates
        run: |
          if ./tools/find-diff-or-untracked.sh operations/helm/; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi
      # Tar preserves symlinks; the complete tree also records deleted files.
      - name: Archive generated files
        if: steps.check_updates.outputs.has_changes == 'true'
        run: tar -cf regenerated-helm.tar operations/helm
      - name: Upload generated files
        if: steps.check_updates.outputs.has_changes == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: regenerated-helm
          path: regenerated-helm.tar
          retention-days: 1

  commit_changes:
    runs-on: ubuntu-latest
    needs: lint_and_update
    if: needs.lint_and_update.outputs.has_changes == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Download generated files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: regenerated-helm
      - name: Restore generated tree
        run: |
          rm -rf operations/helm
          tar -xf regenerated-helm.tar
          git add -A -- operations/helm/
          python3 tools/check-api-file-modes.py operations/helm/
      - name: Generate GitHub App Token
        id: token
        uses: grafana/shared-workflows/actions/create-github-app-token@46f48da11e78ebdba7a8747ae456b11062fac83e # create-github-app-token/v0.3.1
        with:
          github_app: mimir-github-bot
      - name: Commit generated files
        uses: planetscale/ghcommit-action@a6b150b81dca5dd027baa898604418eec9e11465 # v0.2.22
        with:
          commit_message: Update build with regenerated helm tests and docs
          repo: ${{ github.repository }}
          branch: ${{ github.head_ref }}
          file_pattern: operations/helm/
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
