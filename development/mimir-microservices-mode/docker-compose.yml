"services":
  "compactor":
    "build":
      "context": "."
      "dockerfile": "dev.dockerfile"
    "command":
      - "/bin/sh"
      - "-c"
      - "sleep 3 && exec /bin/mimir -config.file=/etc/mimir/mimir.yaml -target=compactor -server.http-listen-port=8006 -server.grpc-listen-port=9006 -activity-tracker.filepath=/tmp/activity/compactor-8006 -memberlist.nodename=compactor -memberlist.bind-port=10006 -usage-stats.enabled=false"
    "depends_on":
      - "minio"
      - "distributor-1"
    "environment":
      - "JAEGER_AGENT_HOST=jaeger"
      - "JAEGER_AGENT_PORT=6831"
      - "JAEGER_SAMPLER_PARAM=1"
      - "JAEGER_SAMPLER_TYPE=const"
      - "JAEGER_TAGS=app=compactor"
    "hostname": "compactor"
    "image": "mimir"
    "ports":
      - "8006:8006"
      - "10006:10006"
    "volumes":
      - "./config:/etc/mimir"
      - "./activity:/tmp/activity"
  "consul":
    "command":
      - "agent"
      - "-dev"
      - "-client=0.0.0.0"
      - "-log-level=debug"
    "hostname": "consul"
    "image": "consul:1.15"
    "ports":
      - "8500:8500"
  "distributor-1":
    "build":
      "context": "."
      "dockerfile": "dev.dockerfile"
    "command":
      - "/bin/sh"
      - "-c"
      - "sleep 3 && exec /bin/mimir -config.file=/etc/mimir/mimir.yaml -target=distributor -server.http-listen-port=8000 -server.grpc-listen-port=9000 -activity-tracker.filepath=/tmp/activity/distributor-8000 -memberlist.nodename=distributor -memberlist.bind-port=10000 -usage-stats.enabled=false -distributor.ha-tracker.consul.hostname=consul:8500"
    "depends_on":
      - "minio"
    "environment":
      - "JAEGER_AGENT_HOST=jaeger"
      - "JAEGER_AGENT_PORT=6831"
      - "JAEGER_SAMPLER_PARAM=1"
      - "JAEGER_SAMPLER_TYPE=const"
      - "JAEGER_TAGS=app=distributor"
    "hostname": "distributor-1"
    "image": "mimir"
    "ports":
      - "8000:8000"
      - "10000:10000"
    "volumes":
      - "./config:/etc/mimir"
      - "./activity:/tmp/activity"
  "distributor-2":
    "build":
      "context": "."
      "dockerfile": "dev.dockerfile"
    "command":
      - "/bin/sh"
      - "-c"
      - "sleep 3 && exec /bin/mimir -config.file=/etc/mimir/mimir.yaml -target=distributor -server.http-listen-port=8001 -server.grpc-listen-port=9001 -activity-tracker.filepath=/tmp/activity/distributor-8001 -memberlist.nodename=distributor -memberlist.bind-port=10001 -usage-stats.enabled=false -distributor.ha-tracker.consul.hostname=consul:8500"
    "depends_on":
      - "minio"
    "environment":
      - "JAEGER_AGENT_HOST=jaeger"
      - "JAEGER_AGENT_PORT=6831"
      - "JAEGER_SAMPLER_PARAM=1"
      - "JAEGER_SAMPLER_TYPE=const"
      - "JAEGER_TAGS=app=distributor"
    "hostname": "distributor-2"
    "image": "mimir"
    "ports":
      - "8001:8001"
      - "10001:10001"
    "volumes":
      - "./config:/etc/mimir"
      - "./activity:/tmp/activity"
  "grafana":
    "environment":
      - "GF_AUTH_ANONYMOUS_ENABLED=true"
      - "GF_AUTH_ANONYMOUS_ORG_ROLE=Admin"
    "image": "grafana/grafana:12.1.1"
    "ports":
      - "3000:3000"
    "volumes":
      - "./config/datasources.yaml:/etc/grafana/provisioning/datasources/mimir.yaml"
      - "./config/dashboards-mimir.yaml:/etc/grafana/provisioning/dashboards/mimir.yaml"
      - "../../operations/mimir-mixin-compiled/dashboards:/var/lib/grafana/dashboards/Mimir"
  "grpc-tee-1":
    "build":
      "context": "../../tools/grpc-tee"
      "dockerfile": "dev.dockerfile"
    "command":
      - "/bin/dlv"
      - "exec"
      - "/bin/grpc-tee"
      - "--listen=:19095"
      - "--headless=true"
      - "--api-version=2"
      - "--accept-multiclient"
      - "--continue"
      - "--"
      - "-server.grpc-listen-address=:9095"
      - "-server.http-listen-address=:8095"
      - "-backend.primary.name=store-gateway-1"
      - "-backend.primary.type=store-gateway"
      - "-backend.primary.address=store-gateway-1:9011"
      - "-backend.primary.ring.key=store-gateway"
      - "-backend.primary.ring.store=memberlist"
      - "-backend.primary.ring.replication-factor=2"
      - "-backend.primary.ring.heartbeat-timeout=15s"
      - "-backend.primary.ring.zone-awareness-enabled=true"
      - "-backend.secondary.name=store-gateway-5"
      - "-backend.secondary.type=store-gateway"
      - "-backend.secondary.address=store-gateway-5:9015"
      - "-backend.secondary.ring.key=store-gateway"
      - "-backend.secondary.ring.prefix=secondary/"
      - "-backend.secondary.ring.store=memberlist"
      - "-backend.secondary.ring.replication-factor=2"
      - "-backend.secondary.ring.heartbeat-timeout=15s"
      - "-backend.secondary.ring.zone-awareness-enabled=true"
      - "-ring.store=memberlist"
      - "-ring.instance-id=grpc-tee-1"
      - "-ring.instance-addr=grpc-tee-1"
      - "-ring.instance-port=9095"
      - "-memberlist.nodename=grpc-tee-1"
      - "-memberlist.join=distributor-1:10000"
    "depends_on":
      - "distributor-1"
      - "store-gateway-1"
      - "store-gateway-5"
    "hostname": "grpc-tee-1"
    "image": "grpc-tee"
    "ports":
      - "9095:9095"
      - "8095:8095"
      - "19095:19095"
  "grpc-tee-2":
    "build":
      "context": "../../tools/grpc-tee"
      "dockerfile": "dev.dockerfile"
    "command":
      - "/bin/dlv"
