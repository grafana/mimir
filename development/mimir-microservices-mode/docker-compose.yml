      - "-backend.secondary.ring.zone-awareness-enabled=true"
      - "-ring.store=memberlist"
      - "-ring.instance-id=grpc-tee-2"
      - "-ring.instance-addr=grpc-tee-2"
      - "-ring.instance-port=9096"
      - "-memberlist.nodename=grpc-tee-2"
      - "-memberlist.join=distributor-1:10000"
    "depends_on":
