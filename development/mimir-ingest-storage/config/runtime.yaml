# This file can be used to set overrides or other runtime config.
overrides:
  anonymous:
    labels_query_optimizer_enabled: true
    ruler_evaluation_consistency_max_delay: 1m
  # standard and delayed receive identical series from tools/freshness-loadgen.
  standard:
    cardinality_analysis_enabled: true
  delayed:
    cardinality_analysis_enabled: true
    # Don't cache results newer than the block-builder lag: delayed series fill in after publication.
    max_cache_freshness: 30m
    delayed_series:
      - match: '{__name__="grafana_http_request_duration_seconds_count"}'
        retired_at: 2026-09-25T18:06:55Z
