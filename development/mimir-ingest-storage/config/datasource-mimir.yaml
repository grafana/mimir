apiVersion: 1
datasources:
  - name: Mimir
    type: prometheus
    access: proxy
    uid: mimir
    orgID: 1
    url: http://nginx:8080/prometheus
    isDefault: true
    jsonData:
      prometheusType: Mimir
      timeInterval: 5s
      # Delayed series come from local store-gateways; wide queries over them can take ~1 minute.
      timeout: 120
      httpHeaderName1: X-Scope-OrgID
    secureJsonData:
      httpHeaderValue1: anonymous
  - name: Mimir (standard)
    type: prometheus
    access: proxy
    uid: mimir-standard
    orgID: 1
    url: http://nginx:8080/prometheus
    jsonData:
      prometheusType: Mimir
      timeInterval: 5s
      # Delayed series come from local store-gateways; wide queries over them can take ~1 minute.
      timeout: 120
      httpHeaderName1: X-Scope-OrgID
    secureJsonData:
      httpHeaderValue1: standard
  - name: Mimir (delayed)
    type: prometheus
    access: proxy
    uid: mimir-delayed
    orgID: 1
    url: http://nginx:8080/prometheus
    jsonData:
      prometheusType: Mimir
      timeInterval: 5s
      # Delayed series come from local store-gateways; wide queries over them can take ~1 minute.
      timeout: 120
      httpHeaderName1: X-Scope-OrgID
    secureJsonData:
      httpHeaderValue1: delayed
  - name: Tempo
    type: tempo
    access: proxy
    uid: tempo
    orgID: 1
    url: http://tempo:3200/
  - name: Loki
    type: loki
    access: proxy
    uid: loki
    orgID: 1
    url: http://loki:3100/
