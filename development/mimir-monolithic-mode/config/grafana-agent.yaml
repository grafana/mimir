server:
  log_level: debug

prometheus:
  global:
    scrape_interval: 5s
    external_labels:
      scraped_by: grafana-agent
  configs:
    - name: local
      host_filter: false
      # These jobs keep labels that the Mimir dashboards do not select.
      # The default compose-up.sh profiles run this agent next to Prometheus.
      # Both write the same targets to Mimir.
      # Only the scraped_by label tells the two copies apart.
      # With the mixin labels, the dashboards would count each series twice.
      scrape_configs:
        - job_name: mimir-1
          static_configs:
            - targets: ['mimir-1:8001']
              labels:
                container: 'mimir-1'
        - job_name: mimir-2
          static_configs:
            - targets: ['mimir-2:8002']
              labels:
                container: 'mimir-2'

      remote_write:
        - url: http://mimir-1:8001/api/v1/push
