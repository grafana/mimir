# Runs the bench as one pod of three containers, each with exclusive CPUs on a node whose kubelet has the static CPU
# manager policy: their requests are their limits, in whole CPUs. The driver runs the generator, the in-process Kafka
# and the reads; each ingester container waits for the command line the driver writes once the backfill is done, and
# runs it as its own process. Replace the image, and the profile ConfigMap if any; read the report from the driver's
# logs, or, while it holds, from its port 8090: kubectl port-forward <pod> 8090, then report.html, report.json and the
# profiles at http://localhost:8090/.
apiVersion: batch/v1
kind: Job
metadata:
  name: ingester-bench
spec:
  backoffLimit: 0
  template:
    metadata:
      annotations:
        # A run is an hour's worth of state: nodes being consolidated must not evict it.
        karpenter.sh/do-not-disrupt: "true"
    spec:
      restartPolicy: Never
      # The driver stops the ingesters through their PIDs.
      shareProcessNamespace: true
      containers:
        - name: driver
          image: IMAGE
          args:
            - -external=/shared
            - -out=/out
            - -kafka-port=9092
            - -kafka-dir=/out/kafka
            # About 2M series in memory, with the ones churned out the head still has.
            - -series=1650000
            - -backfill=4h
            - -warmup=5m
            - -duration=15m
            - -hold=1h
            # Comparing every read at production rates takes the driver more CPU than reading takes the ingesters.
            - -compare-fraction=0.1
            # - -profile=/profile/profile.json
          # The in-process Kafka holds the backfill, and reads of the largest queries hold their responses.
          resources:
            requests: { cpu: "8", memory: 32Gi }
            limits: { cpu: "8", memory: 32Gi }
          volumeMounts:
            - { name: shared, mountPath: /shared }
            - { name: out, mountPath: /out }
            # - { name: profile, mountPath: /profile }
        - name: ingester-a
          image: IMAGE
          args: [-exec=/shared/a.json]
          resources:
            requests: { cpu: "4", memory: 32Gi }
            limits: { cpu: "4", memory: 32Gi }
          volumeMounts:
            - { name: shared, mountPath: /shared }
            - { name: data-a, mountPath: /data }
        - name: ingester-b
          image: IMAGE
          args: [-exec=/shared/b.json]
          resources:
            requests: { cpu: "4", memory: 32Gi }
            limits: { cpu: "4", memory: 32Gi }
          volumeMounts:
            - { name: shared, mountPath: /shared }
            - { name: data-b, mountPath: /data }
      volumes:
        - { name: shared, emptyDir: {} }
        - { name: out, emptyDir: {} }
        - { name: data-a, emptyDir: {} }
        - { name: data-b, emptyDir: {} }
        # - { name: profile, configMap: { name: ingester-bench-profile } }
