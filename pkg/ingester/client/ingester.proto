syntax = "proto3";

// TODO: Rename to ingesterpb
package cortex;

import "github.com/grafana/mimir/pkg/mimirpb/mimir.proto";
import "gogoproto/gogo.proto";

option go_package = "client";
option (gogoproto.marshaler_all) = true;
option (gogoproto.unmarshaler_all) = true;

service Ingester {
  rpc Push(cortexpb.WriteRequest) returns (cortexpb.WriteResponse) {}
  rpc QueryStream(QueryRequest) returns (stream QueryStreamResponse) {}
  rpc QueryExemplars(ExemplarQueryRequest) returns (ExemplarQueryResponse) {}

  rpc LabelValues(LabelValuesRequest) returns (LabelValuesResponse) {}
  rpc LabelNames(LabelNamesRequest) returns (LabelNamesResponse) {}
  rpc UserStats(UserStatsRequest) returns (UserStatsResponse) {}
  rpc AllUserStats(UserStatsRequest) returns (UsersStatsResponse) {}
  rpc MetricsForLabelMatchers(MetricsForLabelMatchersRequest) returns (MetricsForLabelMatchersResponse) {}
  rpc MetricsMetadata(MetricsMetadataRequest) returns (MetricsMetadataResponse) {}

  // LabelNamesAndValues provides all values for each label that matches the matchers.
  // The order of the labels and values is not guaranteed.
  rpc LabelNamesAndValues(LabelNamesAndValuesRequest) returns (stream LabelNamesAndValuesResponse) {}

  // LabelValuesCardinality returns all values and series total count for label_names labels
  // that match the matchers.
  // The listing order of the labels is not guaranteed.
  rpc LabelValuesCardinality(LabelValuesCardinalityRequest) returns (stream LabelValuesCardinalityResponse) {}

  // SeriesCounts counts the head's series that match the matchers and have a chunk in the window, grouped by one
  // label, from the series' chunk metas without reading samples. The answer is streamed: the first message carries
  // every field, the next ones only more groups. Experimental.
  rpc SeriesCounts(SeriesCountsRequest) returns (stream SeriesCountsResponse) {}

  rpc ActiveSeries(ActiveSeriesRequest) returns (stream ActiveSeriesResponse) {}

  // SearchLabelNames streams label names matching the search filter.
  rpc SearchLabelNames(SearchLabelNamesRequest) returns (stream SearchResultBatch) {}

  // SearchLabelValues streams label values for the given label name matching the search filter.
  rpc SearchLabelValues(SearchLabelValuesRequest) returns (stream SearchResultBatch) {}

  // When adding more read-path methods here, please update ingester_read_path_routes_regex in operations/mimir-mixin/config.libsonnet as well.
}

message LabelNamesAndValuesRequest {
  repeated LabelMatcher matchers = 1;
  CountMethod count_method = 2;
}

message LabelNamesAndValuesResponse {
  repeated LabelValues items = 1;
}

message LabelValues {
  string label_name = 1;
  repeated string values = 2;
}

enum CountMethod {
  IN_MEMORY = 0;
  ACTIVE = 1;
}

message SeriesCountsRequest {
  // Series to count. Empty means every series.
  repeated LabelMatcher matchers = 1;
  // Window in milliseconds, [start_timestamp_ms, end_timestamp_ms). A series counts if one of its chunks overlaps it.
  int64 start_timestamp_ms = 2;
  int64 end_timestamp_ms = 3;
  // If set, a bucket starts every step_ms from start_timestamp_ms and each group gets one count per bucket.
  int64 step_ms = 4;
  // Label to group by. Empty means __name__.
  string group_by = 5;
  // If set, each group carries its series' label-set hashes instead of a count. Not allowed with step_ms.
  bool hashes = 6;
  // With hashes, a group with more series than this carries a HyperLogLog sketch instead. 0 means always hashes.
  int64 sketch_above = 7;
  // Fail with ResourceExhausted rather than walk the series when the matching series, priced at an estimated
  // series entry size, come to more than this many bytes. 0 means no limit.
  int64 max_index_bytes = 8;
  // If set, the ingester counts only when it has seen the tenant's shard size unchanged since before this time, in
  // milliseconds. Otherwise it walks nothing and returns a response with shard_size_changed set. A caller that adds
  // up counts across partitions sets it, since a series can be in two partitions after the shard grows.
  int64 shard_size_unchanged_before_ms = 9;
  // With step_ms, each bucket's width: bucket i covers [start + i*step_ms, start + i*step_ms + window_ms), and the
  // last one ends at end_timestamp_ms. 0 means step_ms, adjacent buckets. A window wider than the step makes the
  // buckets overlap, so a bucket counts the series with a sample in the window before its end. Echoed in the
  // response, so a caller can tell a source that ignored it.
  int64 window_ms = 10;
  // With hashes, the most label-set hashes the ingester may hold for the request. It is refused with ResourceExhausted
  // before the walk when one local block inside the window matches more series than this, and during the walk once
  // the distinct series counted in the window pass it. 0 means no limit.
  int64 max_hashes = 11;
  // The most distinct values of group_by, so groups, the answer may hold. The request is refused with
  // ResourceExhausted before counting when one local block inside the window, with no matchers, already holds more
  // values, and while counting once the groups pass it. 0 means no limit. Added after max_hashes with a new number.
  int64 max_groups = 12;
}

message SeriesCountGroup {
  string value = 1;
  // One count per bucket, or a single count when there is no step.
  repeated int64 counts = 2;
  repeated uint64 hashes = 3;
  // A marshalled axiomhq/hyperloglog sketch of the group's label-set hashes, set instead of hashes above sketch_above.
  bytes sketch = 4;
}

message SeriesCountsResponse {
  repeated SeriesCountGroup groups = 1;
  // series_walked, head_min_time_ms and head_max_time_ms were never read.
  reserved 2, 4, 5;
  int64 series_counted = 3;
  // The oldest time this ingester holds for the tenant, the start of its oldest local block or of its head, whether
  // or not it is in the window. Samples before it are no longer on this ingester. 0 only when it holds no series and
  // no block for the tenant.
  int64 min_time_ms = 6;
  reserved 7;
  // The time, in milliseconds, since which this ingester has seen the tenant's shard size unchanged. 0 when it
  // doesn't know: owned-series tracking is off, or it has not checked the tenant yet.
  int64 shard_size_unchanged_since_ms = 8;
  // Set when the request's shard_size_unchanged_before_ms was not met. Nothing is counted then.
  bool shard_size_changed = 9;
  // The request's window_ms, which this ingester counted with.
  int64 window_ms = 10;
}

message LabelValuesCardinalityRequest {
  repeated string label_names = 1;
  repeated LabelMatcher matchers = 2;
  CountMethod count_method = 3;
}

message LabelValuesCardinalityResponse {
  repeated LabelValueSeriesCount items = 1;
}

message LabelValueSeriesCount {
  string label_name = 1;
  map<string, uint64> label_value_series = 2;
}

message QueryRequest {
  int64 start_timestamp_ms = 1;
  int64 end_timestamp_ms = 2;
  repeated LabelMatcher matchers = 3;
  reserved 4; // projections include, not used anymore.
  reserved 5; // projections labels, not used anymore.

  // Why 100? This QueryRequest message is also used for remote read requests, so we need to avoid any field numbers added in the future.
  uint64 streaming_chunks_batch_size = 100;
}

message ExemplarQueryRequest {
  int64 start_timestamp_ms = 1;
  int64 end_timestamp_ms = 2;
  repeated LabelMatchers matchers = 3;
}

message ActiveSeriesRequest {
  repeated LabelMatcher matchers = 1;
  enum RequestType {
    SERIES = 0;
    NATIVE_HISTOGRAM_SERIES = 1;
  }
  RequestType type = 2;
}

// SearchOrdering selects the result ordering wire-side. Values mirror the
// Prometheus storage.Ordering enum so the server-side translation is 1:1.
enum SearchOrdering {
  ORDER_BY_VALUE_ASC = 0;
  ORDER_BY_VALUE_DESC = 1;
  ORDER_BY_SCORE_DESC = 2;
}

// SearchFilter is the wire encoding of the filter applied to a search
// request. Field names match Prometheus PR #18573's HTTP URL params so the
// HTTP-to-gRPC translation in the querier (later PR) is verbatim.
message SearchFilter {
  // Terms are the search terms; combined with OR-max by filterOr at the server.
  repeated string terms = 1;
  // CaseInsensitive flips the search to be case-insensitive. The proto3 zero
  // value (false) means case-sensitive — matching Prometheus's HTTP
  // case_sensitive URL-param default of true. The HTTP handler in the later
  // PR translates the URL param to this wire bit (case_sensitive=false URL
  // param → case_insensitive=true wire bit).
  bool case_insensitive = 2;

  enum FuzzAlg {
    FUZZ_ALG_SUBSEQUENCE = 0;
    FUZZ_ALG_JARO_WINKLER = 1;
  }
  FuzzAlg fuzz_alg = 3;
  // FuzzThreshold is the minimum fuzzy score expressed as int 0-100,
  // matching Prometheus PR #18573's fuzz_threshold URL param. The server
  // divides by 100 to compare against the matcher's [0,1] score.
  int32 fuzz_threshold = 4;
}

message SearchLabelNamesRequest {
  int64 start_timestamp_ms = 1;
  int64 end_timestamp_ms = 2;
  repeated LabelMatcher matchers = 3;
  SearchFilter filter = 4;
  SearchOrdering ordering = 5;
  // Limit caps the number of accepted results; 0 means no limit.
  int64 limit = 6;
}

message SearchLabelValuesRequest {
  int64 start_timestamp_ms = 1;
  int64 end_timestamp_ms = 2;
  // Name is the label whose values are searched.
  string name = 3;
  repeated LabelMatcher matchers = 4;
  SearchFilter filter = 5;
  SearchOrdering ordering = 6;
  int64 limit = 7;
  // 8 was include_metadata: it asked the ingester to enrich each result with
  // metric metadata. Enrichment now happens on the querier, so the field was
  // removed.
  reserved 8;
}

// SearchResultBatch carries one batch of (value, score) pairs in a streaming
// reply. Both SearchLabel{Names,Values} use this shape. Warnings, when
// present, accompany the final batch of a stream and carry annotations
// produced by the underlying Searcher.
message SearchResultBatch {
  message Result {
    string value = 1;
    double score = 2;
    // 3 was metadata: per-result metric metadata. Enrichment now happens on the
    // querier, so the field was removed.
    reserved 3;
  }
  repeated Result results = 1 [(gogoproto.nullable) = false];
  repeated string warnings = 2;
}

// QueryStreamResponse contains either:
// - a batch of series labels (sorted in series order), with is_end_of_series_stream=true for the last batch or
// - a batch of chunks (sorted in series order).
//
// Only one of these two options will be populated.
message QueryStreamResponse {
  reserved 1; // "chunkseries" aren't used anymore, only streaming series.
  reserved 2; // "timeseries" aren't used anymore, only streaming series.

  repeated QueryStreamSeries streaming_series = 3 [(gogoproto.nullable) = false];
  bool is_end_of_series_stream = 4;

  repeated QueryStreamSeriesChunks streaming_series_chunks = 5 [(gogoproto.nullable) = false];
}

message QueryStreamSeries {
  repeated cortexpb.LabelPair labels = 1 [
    (gogoproto.nullable) = false,
    (gogoproto.customtype) = "github.com/grafana/mimir/pkg/mimirpb.LabelAdapter"
  ];
  int64 chunk_count = 2;
}

message QueryStreamSeriesChunks {
  uint64 series_index = 1; // Index into list of all series previously sent with QueryStreamSeries messages by this ingester during this query response.
  repeated Chunk chunks = 2 [(gogoproto.nullable) = false];
}

message ExemplarQueryResponse {
  repeated cortexpb.TimeSeries timeseries = 1 [(gogoproto.nullable) = false];
}

message LabelValuesRequest {
  string label_name = 1;
  int64 start_timestamp_ms = 2;
  int64 end_timestamp_ms = 3;
  LabelMatchers matchers = 4;
  int64 limit = 5;
}

message LabelValuesResponse {
  repeated string label_values = 1;
}

message LabelNamesRequest {
  int64 start_timestamp_ms = 1;
  int64 end_timestamp_ms = 2;
  LabelMatchers matchers = 3;
  int64 limit = 4;
}

message LabelNamesResponse {
  repeated string label_names = 1;
}

message UserStatsRequest {
  CountMethod count_method = 1;
}

message UserStatsResponse {
  double ingestion_rate = 1;
  uint64 num_series = 2;
  double api_ingestion_rate = 3;
  double rule_ingestion_rate = 4;
}

message UserIDStatsResponse {
  string user_id = 1;
  UserStatsResponse data = 2;
}

message UsersStatsResponse {
  repeated UserIDStatsResponse stats = 1;
}

message MetricsForLabelMatchersRequest {
  int64 start_timestamp_ms = 1;
  int64 end_timestamp_ms = 2;
  repeated LabelMatchers matchers_set = 3;
  int64 limit = 4;
}

message MetricsForLabelMatchersResponse {
  repeated cortexpb.Metric metric = 1;
}

message MetricsMetadataRequest {
  sint32 limit = 1;
  sint32 limit_per_metric = 2;

  // Metric restricts the response to metadata for the given metric name.
  // Empty means no name restriction.
  //
  // Deprecated: use metric_names instead.
  string metric = 3;

  // MetricNames restricts the response to metadata for the given metric names.
  // Empty means no name restriction. When set, it takes precedence over the
  // single-name metric field.
  repeated string metric_names = 4;
}

message MetricsMetadataResponse {
  repeated cortexpb.MetricMetadata metadata = 1;
}

message ActiveSeriesResponse {
  repeated cortexpb.Metric metric = 1;
  // bucket_count is only used when the request type was NATIVE_HISTOGRAM_SERIES.
  // bucket_count contains the native histogram active buckets count for each series in "metric" above.
  repeated uint64 bucket_count = 2;
}

message Chunk {
  int64 start_timestamp_ms = 1;
  int64 end_timestamp_ms = 2;
  int32 encoding = 3;
  bytes data = 4 [
    (gogoproto.nullable) = false,
    (gogoproto.customtype) = "github.com/grafana/mimir/pkg/mimirpb.UnsafeByteSlice"
  ];
}

message LabelMatchers {
  repeated LabelMatcher matchers = 1;
}

enum MatchType {
  EQUAL = 0;
  NOT_EQUAL = 1;
  REGEX_MATCH = 2;
  REGEX_NO_MATCH = 3;
}

message LabelMatcher {
  MatchType type = 1;
  string name = 2;
  string value = 3;
}
