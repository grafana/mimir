syntax = "proto3";
package gatewaypb;

import "github.com/grafana/mimir/pkg/cardinality/cardinalitypb/cardinality.proto";
import "github.com/grafana/mimir/pkg/storegateway/storepb/rpc.proto";
import "gogoproto/gogo.proto";

option go_package = "storegatewaypb";

service StoreGateway {
  // Series streams each Series for given label matchers and time range.
  //
  // Series should strictly stream full series after series, optionally split by time. This means that a single frame can contain
  // partition of the single series, but once a new series is started to be streamed it means that no more data will
  // be sent for previous one.
  //
  // Series are sorted.
  rpc Series(thanos.SeriesRequest) returns (stream thanos.SeriesResponse);

  // LabelNames returns all label names that is available.
  rpc LabelNames(thanos.LabelNamesRequest) returns (thanos.LabelNamesResponse);

  // LabelValues returns all label values for given label name.
  rpc LabelValues(thanos.LabelValuesRequest) returns (thanos.LabelValuesResponse);

  // SearchLabelNames streams label names matching the search filter.
  rpc SearchLabelNames(thanos.SearchLabelNamesRequest) returns (stream thanos.SearchResultBatch);

  // SearchLabelValues streams label values for the given label name matching the search filter.
  rpc SearchLabelValues(thanos.SearchLabelValuesRequest) returns (stream thanos.SearchResultBatch);

  // SeriesCounts counts the series in the given blocks that match the matchers and have a chunk in the window,
  // grouped by one label. A block inside the window with no matchers, hashes or query shard is counted from
  // its postings offsets table alone when that table is cheaper than reading its series entries; otherwise it reads
  // postings and series entries. The groups are streamed in value
  // order, in batches; the first message carries every other field, and a response always has one. Experimental.
  rpc SeriesCounts(SeriesCountsRequest) returns (stream SeriesCountsResponse);

  // When adding more read-path methods here, please update store_gateway_read_path_routes_regex in operations/mimir-mixin/config.libsonnet as well as needed.
}

message SeriesCountsRequest {
  // What to count. The store-gateway refuses a request that would hold more than the tenant's cardinality estimate
  // memory limit in expanded postings, groups and hashes, before the memory is taken.
  cardinalitypb.CountQuery query = 1 [
    (gogoproto.embed) = true,
    (gogoproto.nullable) = false
  ];
  // Blocks to count, as ULID strings. Blocks this store-gateway does not hold are left out of the response's block_ids.
  repeated string block_ids = 2;
  // The most groups the answer may have. With no matchers and no query shard, a request is refused with
  // ResourceExhausted before any postings offsets table is walked when one block inside the window holds more
  // distinct values of group_by than this, from the index-header's samples; and after counting when the groups are
  // more. 0 means no limit.
  int64 max_groups = 3;
  // If set, every block is counted on its own from the group-by label's postings offsets table alone, whatever the
  // window, and each group carries its block_id. No postings and no series entries are read. Not allowed with
  // matchers or hashes; max_groups then applies to each block.
  bool per_block = 4;
}

message SeriesCountsResponse {
  // The groups, in value order, batched across the stream's messages; see cardinalitypb.SeriesCountGroup.
  repeated cardinalitypb.SeriesCountGroup groups = 1;
  // Blocks that were fully counted.
  repeated string block_ids = 2;
  int64 series_counted = 4;
  // Bytes of postings and series entries read from the bucket, not from a cache.
  int64 postings_fetched_bytes = 5;
  int64 series_fetched_bytes = 6;
  // Postings and series bytes read, cached or not: for postings the larger of the bytes touched and the bytes
  // fetched from the bucket, for series the bytes of the entries processed.
  int64 index_bytes = 7;
  // Blocks counted from the group-by label's postings, without reading series entries, because they sit inside
  // the window and the postings were the cheaper read.
  int64 blocks_from_postings = 8;
  // Bytes of the postings offsets tables walked, for the group-by label and for planning the matchers, priced from
  // the index-header's samples. With index-header version 2 the table is read from object storage.
  int64 postings_offsets_table_bytes = 9;
  // Blocks counted from the postings offsets table alone, reading no postings and no series entries: blocks
  // inside the window with no matchers, hashes or query shard whose table is cheaper than their series
  // entries.
  int64 blocks_from_offsets_table = 11;
}
