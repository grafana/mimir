syntax = "proto3";
package gatewaypb;

import "github.com/grafana/mimir/pkg/storegateway/storepb/rpc.proto";
import "types.proto";

option go_package = "storegatewaypb";

service StoreGateway {
  // Series streams each Series for given label matchers and time range.
  //
  // Series should strictly stream full series after series, optionally split by time. This means that a single frame can contain
  // partition of the single series, but once a new series is started to be streamed it means that no more data will
  // be sent for previous one.
  //
  // Series are sorted.
  rpc Series(thanos.SeriesRequest) returns (stream thanos.SeriesResponse);

  // LabelNames returns all label names that is available.
  rpc LabelNames(thanos.LabelNamesRequest) returns (thanos.LabelNamesResponse);

  // LabelValues returns all label values for given label name.
  rpc LabelValues(thanos.LabelValuesRequest) returns (thanos.LabelValuesResponse);

  // SearchLabelNames streams label names matching the search filter.
  rpc SearchLabelNames(thanos.SearchLabelNamesRequest) returns (stream thanos.SearchResultBatch);

  // SearchLabelValues streams label values for the given label name matching the search filter.
  rpc SearchLabelValues(thanos.SearchLabelValuesRequest) returns (stream thanos.SearchResultBatch);

  // MetricNameCounts streams every metric name's series count in the given blocks, read from the blocks'
  // index-headers, in batches of names. Every message carries block_ids; counts are spread over the messages.
  // Experimental: the caller is responsible for asking only for blocks that share no series.
  rpc MetricNameCounts(MetricNameCountsRequest) returns (stream MetricNameCountsResponse);

  // SeriesCounts counts the series in the given blocks that match the matchers and have a chunk in the window,
  // grouped by one label. Unlike MetricNameCounts it reads series entries from the full index, so it can filter by
  // matchers and by chunk times. Experimental.
  rpc SeriesCounts(SeriesCountsRequest) returns (SeriesCountsResponse);

  // When adding more read-path methods here, please update store_gateway_read_path_routes_regex in operations/mimir-mixin/config.libsonnet as well as needed.
}

message MetricNameCountsRequest {
  // Blocks to count, as ULID strings. Blocks this store-gateway does not hold are left out of the response's block_ids.
  repeated string block_ids = 1;
  // Refuse with RESOURCE_EXHAUSTED when the blocks hold more distinct metric names than this. 0 means no limit.
  int64 max_names = 2;
  // Refuse with RESOURCE_EXHAUSTED, before any is read, when the blocks' __name__ postings offsets table entries,
  // priced from the index-header's samples, come to more than this many bytes. The store-gateway's tenant limit
  // bounds it too. 0 means only that limit.
  int64 max_index_bytes = 3;
}

message MetricNameCount {
  string name = 1;
  int64 count = 2;
}

message MetricNameCountsResponse {
  // Per-name series counts summed over the counted blocks, a batch of the whole table.
  repeated MetricNameCount counts = 1;
  // Blocks that were counted. Set on every message of the stream.
  repeated string block_ids = 2;
  // Bytes of the __name__ postings offsets table entries walked, priced as for max_index_bytes. Set on the first
  // message of the stream only.
  int64 postings_offsets_table_bytes = 3;
}

message SeriesCountsRequest {
  // Blocks to count, as ULID strings. Blocks this store-gateway does not hold are left out of the response's block_ids.
  repeated string block_ids = 1;
  // Series to count. Empty means every series.
  repeated thanos.LabelMatcher matchers = 2;
  // Window in milliseconds, [min_time, max_time). A series counts if one of its chunks overlaps the window.
  int64 min_time = 3;
  int64 max_time = 4;
  // If set, a bucket starts every step_ms from min_time and each group gets one count per bucket.
  int64 step_ms = 5;
  // Label to group by. Empty means __name__.
  string group_by = 6;
  // If set, each group carries its series' label-set hashes instead of a count, so the caller can union them
  // across blocks that share series. Not allowed with step_ms.
  bool hashes = 7;
  reserved 8; // was max_series
  // Fail with ResourceExhausted rather than read more than this many index bytes, measured as index_bytes plus
  // postings_offsets_table_bytes in the response. Checked before any series entry is read, from the matching
  // postings times an estimated series size, and again while reading. 0 means no limit.
  int64 max_index_bytes = 9;
  // With hashes, a group with more than this many series carries a HyperLogLog sketch (precision 11) instead of its
  // hashes, so its payload is a fixed size. 0 means always hashes.
  int64 sketch_above = 10;
  // With step_ms, each bucket's width: bucket i covers [min_time + i*step_ms, min_time + i*step_ms + window_ms), and
  // the last one ends at max_time. 0 means step_ms, adjacent buckets. A window wider than the step makes the buckets
  // overlap, so a bucket counts the series with a sample in the window before its end. Echoed in the response, so a
  // caller can tell a store-gateway that ignored it.
  int64 window_ms = 11;
  // With hashes, the most label-set hashes the store-gateway may hold for the request. A request whose matching series
  // are more than this, counted from their postings, is refused with ResourceExhausted before any series entry is
  // read. 0 means no limit.
  int64 max_hashes = 12;
}

message SeriesCountGroup {
  string value = 1;
  // One count per bucket, or a single count when there is no step.
  repeated int64 counts = 2;
  repeated uint64 hashes = 3;
  // A marshalled axiomhq/hyperloglog sketch of the group's label-set hashes, set instead of hashes above sketch_above.
  bytes sketch = 4;
}

message SeriesCountsResponse {
  repeated SeriesCountGroup groups = 1;
  // Blocks that were fully counted.
  repeated string block_ids = 2;
  reserved 3; // was lower_bound
  int64 series_counted = 4;
  // Bytes of postings and series entries read from the bucket, not from a cache.
  int64 postings_fetched_bytes = 5;
  int64 series_fetched_bytes = 6;
  // Postings and series bytes read, cached or not. This is what the Series call reports as fetched index bytes.
  int64 index_bytes = 7;
  // Blocks counted from the group-by label's postings, without reading series entries, because they sit inside
  // the window and the postings were the cheaper read.
  int64 blocks_from_postings = 8;
  // Bytes of the group-by label's postings offsets table walked to count blocks from postings, priced from the
  // index-header's samples. With index-header version 2 the table is read from object storage. max_index_bytes
  // bounds index_bytes plus these.
  int64 postings_offsets_table_bytes = 9;
  // The request's window_ms, which this store-gateway counted with.
  int64 window_ms = 10;
}
