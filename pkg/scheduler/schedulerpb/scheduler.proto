syntax = "proto3";

package schedulerpb;

import "github.com/grafana/dskit/httpgrpc/httpgrpc.proto";
import "gogoproto/gogo.proto";
import "google/protobuf/any.proto";

option go_package = "schedulerpb";
option (gogoproto.marshaler_all) = true;
option (gogoproto.unmarshaler_all) = true;

// Scheduler interface exposed to Queriers.
service SchedulerForQuerier {
  // After calling this method, both Querier and Scheduler enter a loop, in which querier waits for
  // "SchedulerToQuerier" messages containing HTTP requests and processes them. After processing the request,
  // querier signals that it is ready to accept another one by sending empty QuerierToScheduler message.
  //
  // Long-running loop is used to detect broken connection between scheduler and querier. This is important
  // for scheduler to keep a list of connected queriers up-to-date.
  rpc QuerierLoop(stream QuerierToScheduler) returns (stream SchedulerToQuerier) {}

  // The querier notifies the query-scheduler that it started a graceful shutdown.
  rpc NotifyQuerierShutdown(NotifyQuerierShutdownRequest) returns (NotifyQuerierShutdownResponse);
}

// Querier reports its own clientID when it connects, so that scheduler knows how many *different* queriers are connected.
// To signal that querier is ready to accept another request, querier sends empty message.
message QuerierToScheduler {
  string querierID = 1;
}

message SchedulerToQuerier {
  // Query ID as reported by frontend. When querier sends the response back to frontend (using frontendAddress),
  // it identifies the query by using this ID.
  uint64 queryID = 1;

  oneof payload {
    httpgrpc.HTTPRequest httpRequest = 2;
    ProtobufRequest protobufRequest = 7;
  }

  // Where should querier send HTTP Response to (using FrontendForQuerier interface).
  string frontendAddress = 3;

  // User who initiated the request. Needed to send reply back to frontend.
  string userID = 4;

  // Whether query statistics tracking should be enabled. The response will include
  // statistics only when this option is enabled.
  bool statsEnabled = 5;

  // How much time did query spend in the queue.
  int64 queueTimeNanos = 6;

  // Identifies the user query this request is a sub-request of, as reported by the frontend.
  // An empty value means unknown.
  string rootQueryID = 8;
}

message ProtobufRequest {
  google.protobuf.Any payload = 1;

  // Metadata is metadata orthogonal to the request itself, analogous to HTTP headers or gRPC metadata.
  // We can't use gRPC metadata in this context because this message is sent over long-lived streams, rather
  // than as an individual request.
  repeated MetadataItem metadata = 2 [(gogoproto.nullable) = false];
}

message MetadataItem {
  string key = 1;
  repeated string value = 2;
}

// Scheduler interface exposed to Frontend. Frontend can reserve queue slots, and enqueue and cancel requests.
service SchedulerForFrontend {
  // After calling this method, both Frontend and Scheduler enter a loop. Frontend will keep sending ENQUEUE,
  // RESERVE, COMPLETE_RESERVATION, and CANCEL requests, and scheduler is expected to process them.
  // Scheduler returns one response for each request.
  //
  // Long-running loop is used to detect broken connection between frontend and scheduler. This is important for both
  // parties... if connection breaks, frontend can cancel (and possibly retry on different scheduler) all pending
  // requests sent to this scheduler, while scheduler can cancel queued requests from given frontend.
  rpc FrontendLoop(stream FrontendToScheduler) returns (stream SchedulerToFrontend) {}
}

enum FrontendToSchedulerType {
  INIT = 0;
  ENQUEUE = 1;
  CANCEL = 2;
  RESERVE = 3;
  COMPLETE_RESERVATION = 4;
}

message FrontendToScheduler {
  FrontendToSchedulerType type = 1;

  // Used by INIT message. Will be put into all requests passed to querier.
  string frontendAddress = 2;

  // Used by ENQUEUE and CANCEL. A CANCEL with queryID 0 and a non-empty reservationID aborts that
  // reservation. Each frontend manages its own queryIDs. Different frontends may use same set of
  // query IDs.
  uint64 queryID = 3;

  // Following are used by ENQUEUE only, except userID. In a RESERVE, userID is the reservation's
  // tenant. An ENQUEUE with the reservationID of an open reservation and another userID gets ERROR.
  string userID = 4;
  oneof payload {
    httpgrpc.HTTPRequest httpRequest = 5;
    ProtobufRequest protobufRequest = 8;
  }
  bool statsEnabled = 6;
  repeated string additionalQueueDimensions = 7;

  // Identifies the user query this request is a sub-request of. The frontend allocates it as a
  // random UUID, so it is globally unique. An empty value means unknown, which is the case for
  // queries that did not come through the frontend's HTTP transport handler.
  string rootQueryID = 9;

  // Used by RESERVE, ENQUEUE, COMPLETE_RESERVATION, and by CANCEL with queryID 0 to abort a
  // reservation. The frontend sets reservationID to a new random UUID for each reservation. It must
  // not be empty, and the frontend must not reuse it on the same frontendAddress, because a late
  // close closes the reservation that has that ID. The reservation ID is not the root query ID,
  // because one root query can run several reservations at once.
  //
  // The frontend sends RESERVE only on a stream whose INIT reply set queueReservationSupported.
  // A RESERVE reserves slots queue slots under the per-tenant limit. The scheduler replies ERROR
  // when the reservationID is already open, or when slots is larger than the per-tenant limit. The
  // frontend must not retry such a RESERVE. The scheduler can ignore a COMPLETE_RESERVATION or an
  // abort that arrives before the RESERVE reply. The reservation timeout then releases the slots.
  //
  // An ENQUEUE with a non-empty reservationID is one sub-request of that reservation. The
  // sub-request uses an idle slot of the reservation, so it cannot fail on the per-tenant limit.
  // When a querier takes the sub-request from the queue, its slot goes back to the reservation.
  // Any stream of the frontend that opened the reservation can send the ENQUEUE, and each one gets
  // its own reply. The frontend must keep at most slots sub-requests of the reservation in the
  // queue. An ENQUEUE when the reservation has no idle slot gets ERROR.
  //
  // An ENQUEUE for an unknown or closed reservation also gets ERROR. For example, a scheduler
  // restart loses all open reservations.
  //
  // The frontend sends COMPLETE_RESERVATION when it sends no more sub-requests for the reservation,
  // retries included. An ENQUEUE after it gets ERROR. A reservation also closes on an abort, or at
  // the end of the frontend's last stream to this scheduler. It also closes when no sub-request is
  // queued or running, and none was inserted or finished within the reservation timeout. A close
  // releases the idle slots, and it does not cancel the inserted sub-requests.
  // But when the frontend's last stream to this scheduler ends, the scheduler cancels all requests
  // of that frontend, as it does for ENQUEUE. A CANCEL per query that arrives before the scheduler
  // inserts the sub-request has no effect.
  //
  // While the scheduler shuts down, it replies SHUTTING_DOWN to the next message on each stream,
  // does not process that message, and ends the stream. So a COMPLETE_RESERVATION, an abort or a
  // CANCEL has no effect then, and the end of the frontend's last stream cancels its queued
  // sub-requests. When its last stream to a scheduler ends, the frontend must treat every queued
  // and reserved sub-request on that scheduler as lost.
  string reservationID = 10;

  // Used by RESERVE only: the maximum number of sub-requests of this reservation in the queue at
  // one time. The scheduler reserves this many queue slots. It must be greater than 0.
  uint64 slots = 12;
}

enum SchedulerToFrontendStatus {
  OK = 0;
  TOO_MANY_REQUESTS_PER_TENANT = 1;
  ERROR = 2;
  SHUTTING_DOWN = 3;
}

message SchedulerToFrontend {
  SchedulerToFrontendStatus status = 1;
  string error = 2;

  // Set on the response to INIT. When false or absent, the scheduler does not support
  // RESERVE or an ENQUEUE with a reservationID, and the frontend must not send them to this
  // scheduler.
  bool queueReservationSupported = 3;
}

message NotifyQuerierShutdownRequest {
  string querierID = 1;
}

message NotifyQuerierShutdownResponse {}
