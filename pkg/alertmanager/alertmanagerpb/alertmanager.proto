syntax = "proto3";

package alertmanagerpb;

import "github.com/grafana/dskit/httpgrpc/httpgrpc.proto";
import "github.com/prometheus/alertmanager/cluster/clusterpb/cluster.proto";

option go_package = "github.com/grafana/mimir/pkg/alertmanager/alertmanagerpb;alertmanagerpb";

// Alertmanager interface exposed to the Alertmanager Distributor and other Alertmanagers
service Alertmanager {
  rpc HandleRequest(httpgrpc.HTTPRequest) returns (httpgrpc.HTTPResponse) {}
  rpc UpdateState(clusterpb.Part) returns (UpdateStateResponse) {}
  rpc ReadState(ReadStateRequest) returns (ReadStateResponse) {}
  rpc ReadTenantDigests(TenantDigestsRequest) returns (TenantDigestsResponse) {}
}
enum UpdateStateStatus {
  OK = 0;
  MERGE_ERROR = 2;
  USER_NOT_FOUND = 3;
}

message UpdateStateResponse {
  UpdateStateStatus status = 1;
  string error = 2;
}

// If only_silences is false, every part is returned, which is what the initial sync uses.
message ReadStateRequest {
  bool only_silences = 1;
}

enum ReadStateStatus {
  READ_UNSPECIFIED = 0;
  READ_OK = 1;
  READ_ERROR = 2;
  READ_USER_NOT_FOUND = 3;
}

message ReadStateResponse {
  ReadStateStatus status = 1;
  string error = 2;
  clusterpb.FullState state = 3;
}

message TenantDigestsRequest {
  repeated string user_ids = 1;
}

enum DigestType {
  DIGEST_TYPE_UNSPECIFIED = 0;
  DIGEST_TYPE_SILENCES = 1;
}

message Digest {
  DigestType type = 1;
  uint64 value = 2;
}

// TenantDigest lets a peer cheaply check whether its own view of a tenant matches this replica's.
// A part missing from digests means "no authoritative data", not zero.
message TenantDigest {
  string user_id = 1;
  bool found = 2;
  repeated Digest digests = 3;
}

message TenantDigestsResponse {
  repeated TenantDigest digests = 1;
}
