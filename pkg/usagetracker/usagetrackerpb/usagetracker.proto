syntax = "proto3";

package usagetrackerpb;

import "gogoproto/gogo.proto";

option go_package = "usagetrackerpb";
option (gogoproto.marshaler_all) = true;
option (gogoproto.unmarshaler_all) = true;

service UsageTracker {
  rpc TrackSeries(TrackSeriesRequest) returns (TrackSeriesResponse);
  rpc TrackSeriesBatch(TrackSeriesBatchRequest) returns (TrackSeriesBatchResponse);
  rpc GetUsersCloseToLimit(GetUsersCloseToLimitRequest) returns (GetUsersCloseToLimitResponse);
  // GetTenantBands returns, for one usage-tracker partition, the hottest
  // locality bands of every tenant (or of one tenant). A band is the top 16
  // bits of the Nautilus locality hash. Counts cover only the series this
  // partition tracks, so a caller scales by the partition count to estimate
  // the tenant-wide figure.
  rpc GetTenantBands(GetTenantBandsRequest) returns (GetTenantBandsResponse);
}

message TrackSeriesRequest {
  // The tenant owning the series.
  string userID = 1;

  // Partition that this series belong to.
  int32 partition = 2;

  // The hashes of the series to track.
  repeated uint64 seriesHashes = 3;

  // Optional Nautilus locality hash of each series, parallel to seriesHashes.
  // Either empty or the same length as seriesHashes. 0 means unknown.
  repeated uint32 localityHashes = 4;
}

message TrackSeriesResponse {
  // The hashes of the series that have been rejected because the tenant is over the limit.
  repeated uint64 rejectedSeriesHashes = 1;
}

message TrackSeriesBatchUser {
  // The tenant owning the series.
  string userID = 1;

  // The hashes of the series to track.
  repeated uint64 seriesHashes = 2;

  // Optional Nautilus locality hash of each series, parallel to seriesHashes.
  // Either empty or the same length as seriesHashes. 0 means unknown.
  repeated uint32 localityHashes = 3;
}

message TrackSeriesBatchPartition {
  // Partition that the series belong to.
  int32 partition = 1;

  // The users along with their series to track.
  repeated TrackSeriesBatchUser users = 2;
}

message TrackSeriesBatchRequest {
  repeated TrackSeriesBatchPartition partitions = 1;
}

message TrackSeriesBatchRejectionUser {
  // UserID for the request that contained rejected hashes.
  string userID = 1;

  // The hashes of the series that have been rejected because the tenant is over the limit.
  repeated uint64 rejectedSeriesHashes = 2;
}

message TrackSeriesBatchRejection {
  // Partition that the rejected series belong to.
  int32 partition = 1;

  // The users along with their rejected series.
  repeated TrackSeriesBatchRejectionUser users = 2;
}

message TrackSeriesBatchResponse {
  repeated TrackSeriesBatchRejection rejections = 1;
}

message SeriesCreatedEvent {
  // The tenant owning the series.
  string userID = 1;

  // Unix timestamp when this event was emitted.
  int64 timestamp = 2;

  // The hashes of the series to track.
  repeated uint64 seriesHashes = 3;

  // Optional Nautilus locality hash of each series, parallel to seriesHashes.
  // Either empty or the same length as seriesHashes. 0 means unknown.
  repeated uint32 localityHashes = 4;
}

message SnapshotRecord {
  int64 timestamp = 1;
  repeated string filenames = 2;

  int64 lastEventOffsetPublishedBeforeSnapshot = 3;
  int64 lastSnapshotEventOffset = 4;
}

message SnapshotEvent {
  int64 timestamp = 1;
  string filename = 2;
}

message SnapshotFile {
  repeated bytes data = 1;
}

message GetUsersCloseToLimitRequest {
  // Optional partition to query. If not specified or -1, a random partition will be selected.
  int32 partition = 1;
}

message GetUsersCloseToLimitResponse {
  // The list of user IDs that are close to their series limit.
  // This list is sorted.
  repeated string sorted_user_ids = 1;

  // The partition that was queried.
  int32 partition = 2;
}

message GetTenantBandsRequest {
  // Partition to query. Must be served by the instance receiving the request.
  int32 partition = 1;

  // Optional tenant filter. Empty returns every tenant on the partition.
  string userID = 2;
}

message TenantBands {
  // The tenant owning the series.
  string userID = 1;

  // Number of active series this partition tracks for the tenant.
  uint64 totalSeries = 2;

  // Number of those series that carried a non-zero locality hash. The band
  // counts below sum to at most this value.
  uint64 localitySeries = 3;

  // Retained bands (top 16 bits of the locality hash), hottest first, and the
  // estimated active series in each. Parallel arrays.
  repeated uint32 bands = 4;
  repeated uint64 counts = 5;
}

message GetTenantBandsResponse {
  // The partition that was queried.
  int32 partition = 1;

  // Total number of usage-tracker partitions. Each partition holds roughly
  // 1/partitions of every tenant's series, so a caller scales counts by this.
  int32 partitions = 2;

  // Unix timestamp (seconds) at which the response was built.
  int64 timestamp = 3;

  repeated TenantBands tenants = 4;
}
