[package]
name = "mimir-engine"
version = "0.2.0"
edition = "2024"
publish = false
license = "AGPL-3.0-only"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
hashbrown = "0.15"
memmap2 = "0.9"
parking_lot = "0.12"
rustc-hash = "2"
xxhash-rust = { version = "0.8", features = ["xxh64"] }

[features]
default = ["jemalloc"]
jemalloc = ["dep:tikv-jemallocator", "dep:tikv-jemalloc-ctl", "dep:tikv-jemalloc-sys"]

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
tikv-jemallocator = { version = "0.7", optional = true }
tikv-jemalloc-ctl = { version = "0.7", optional = true, features = ["stats"] }
tikv-jemalloc-sys = { version = "0.7", optional = true }

[profile.release]
debug = "line-tables-only"
lto = "thin"
codegen-units = 1
panic = "unwind"
